kground:rgba(20,20,30,.9);padding:40px;border-radius:8px;text-align:center;border:2px solid #ff6470}#mini{position:absolute;bottom:16px;left:16px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5)}

<script>
'use strict';
/* ================================================================
   NEXORA 30.2.0 — Optimized Engine
   Performance: Spatial partitioning, better item systems
   Gameplay: Improved combat telegraph, proper item usage
   ================================================================ */

// CONFIG — All magic numbers centralized here
const CONFIG={
  world:{w:7200,h:4800},
  player:{speed:315,acc:2050,fric:1750,radius:20,maxHp:120,baseAttack:28},
  combat:{attackCooldown:.31,attackDuration:.28,telegraghDuration:.35,dodgeCost:28,dodgeIframes:.62,comboWindow:.85},
  enemy:{baseSpawns:42,maxInstances:55,maxDistance:2000},
  collision:{cellSize:240},
  render:{particleLimit:200,maxFootprints:80,maxSpawns:20},
  autosave:12
};

const C=document.getElementById('game'),X=C.getContext('2d',{alpha:false}),M=document.getElementById('mini'),MX=M.getContext('2d');
const UI={hpBar:document.getElementById('hpBar'),xpBar:document.getElementById('xpBar'),hpText:document.getElementById('hpText'),xpText:document.getElementById('xpText'),level:document.getElementById('level'),save:document.getElementById('save'),death:document.getElementById('death'),msg:document.getElementById('msg')};

let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),last=performance.now(),elapsed=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=Math.max(1,Math.floor(W*D));C.height=Math.max(1,Math.floor(H*D));X.setTransform(D,0,0,D,0,0);X.globalAlpha=1}
window.addEventListener('resize',resize);resize();

const world=CONFIG.world;
const SAVE='nexora_save_v3020_v5';
const spawnPoint={x:1050,y:1450};
const def={level:1,xp:0,gold:40,potions:4,kills:0,deaths:0,maxHp:120,hp:120,attack:28,x:spawnPoint.x,y:spawnPoint.y,questKills:0,questComplete:false,equipment:{weapon:'iron_sword',armor:null}};
let saveData={...def};
try{let raw=localStorage.getItem(SAVE);if(!raw)for(const k of['nexora_save_v3010_v5','nexora_save_v3010','nexora_save_v3000'])if(raw=localStorage.getItem(k))break;if(raw)saveData={...def,...JSON.parse(raw)}}catch(e){saveData={...def}}

function num(v,d){const n=Number(v);return Number.isFinite(n)?n:d}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

const p={x:num(saveData.x,spawnPoint.x),y:num(saveData.y,spawnPoint.y),r:CONFIG.player.radius,speed:CONFIG.player.speed,vx:0,vy:0,acc:CONFIG.player.acc,fric:CONFIG.player.fric,hp:num(saveData.hp,120),maxHp:num(saveData.maxHp,120),attack:num(saveData.attack,28),dir:'right',step:0,inv:0,cd:0,atk:0,hurt:0,dead:false,step:0,ignoreId:-1};
p.hp=Math.max(0,Math.min(p.maxHp,p.hp));

const cam={x:0,y:0,shake:0};
const input={up:false,down:false,left:false,right:false};
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
function clearInput(){input.up=input.down=input.left=input.right=false;p.vx=0;p.vy=0}

const keys=Object.create(null);
addEventListener('blur',clearInput);addEventListener('pointerup',()=>{input.up=input.down=input.left=input.right=false});
addEventListener('visibilitychange',()=>{clearInput();last=performance.now()});
addEventListener('keydown',e=>{const k=keyMap[e.key]||keyMap[e.code];if(k){input[k]=true;e.preventDefault()}if(e.code==='Space'&&!e.repeat){e.preventDefault();attack()}if(e.key.toLowerCase()==='q'){e.preventDefault();potion()}if(e.code==='KeyR'){e.preventDefault();resetGame()}});
addEventListener('keyup',e=>{const k=keyMap[e.key]||keyMap[e.code];if(k)input[k]=false});

document.querySelectorAll('.move').forEach(btn=>{const k=btn.dataset.k;const down=e=>{e.preventDefault();input[k]=true;try{btn.setPointerCapture(e.pointerId);btn.classList.add('active')}catch(_){}};const up=e=>{e.preventDefault();input[k]=false;try{btn.releasePointerCapture(e.pointerId);btn.classList.remove('active')}catch(_){}};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up)});

document.getElementById('attack').addEventListener('click',attack);
document.getElementById('potion').addEventListener('click',potion);
addEventListener('beforeunload',save);

/* ================================================================
   SPATIAL PARTITIONING for collision (Quadtree-like grid)
   ================================================================ */
const CELL_SIZE=CONFIG.collision.cellSize;
const collisionGrid={};
function gridKey(x,y){return Math.floor(x/CELL_SIZE)+'_'+Math.floor(y/CELL_SIZE)}
function rebuildCollisionGrid(){
  for(const k in collisionGrid)collisionGrid[k]=[];
  for(const o of obstacles){const k1=gridKey(o.x,o.y),k2=gridKey(o.x+o.w,o.y+o.h);for(let kx=Math.floor(o.x/CELL_SIZE);kx<=Math.floor((o.x+o.w)/CELL_SIZE);kx++)for(let ky=Math.floor(o.y/CELL_SIZE);ky<=Math.floor((o.y+o.h)/CELL_SIZE);ky++){const k=kx+'_'+ky;if(!collisionGrid[k])collisionGrid[k]=[];if(!collisionGrid[k].includes(o))collisionGrid[k].push(o)}}
}
function getNearbyObstacles(x,y,r){const nearby=[];for(let kx=Math.floor((x-r)/CELL_SIZE);kx<=Math.floor((x+r)/CELL_SIZE);kx++)for(let ky=Math.floor((y-r)/CELL_SIZE);ky<=Math.floor((y+r)/CELL_SIZE);ky++){const k=kx+'_'+ky;if(collisionGrid[k])for(const o of collisionGrid[k])if(!nearby.includes(o))nearby.push(o)}return nearby}

/* World generation */
let seed=1357911;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function hash(x,y){let n=(x*374761393+y*668265263)>>>0;n=(n^(n>>13))*1274126177>>>0;return ((n^(n>>16))>>>0)/4294967296}
const obstacles=[],decor=[];
function obstacle(x,y,w,h,type,solid=true,extra={}){obstacles.push({x,y,w,h,type,solid,id:obstacles.length,...extra})}
function deco(x,y,type,scale=1,extra={}){decor.push({x,y,type,scale,id:decor.length,...extra})}

// Terrain generation
obstacle(760,1080,1450,420,'villageGround',false);obstacle(1960,0,260,4800,'road',false);obstacle(0,1270,7200,230,'road',false);obstacle(4680,180,1260,1120,'water',false);
const buildings=[[900,780,420,300,'inn'],[1430,780,360,280,'house'],[1030,1370,390,290,'house'],[1510,1380,330,260,'smith'],[650,1480,250,210,'house'],[1780,1120,300,350,'warehouse']];
for(const b of buildings)obstacle(...b,true);
obstacle(3250,710,360,260,'ruin');obstacle(3530,850,310,210,'ruin');obstacle(5700,2300,500,360,'fort');
for(let i=0;i<65;i++){const x=250+rnd()*6500,y=250+rnd()*4200,w=38+rnd()*90,h=30+rnd()*65;if(x>600&&x<2200&&y>650&&y<1750)continue;if(x>4550&&x<6100&&y<1450)continue;obstacle(x,y,w,h,'rock')}
for(let i=0;i<520;i++){const x=120+rnd()*6900,y=120+rnd()*4500;if(x>620&&x<2200&&y>650&&y<1750)continue;if(x>1880&&x<2240)continue;if(x>4650&&x<6000&&y<1420)continue;const s=.75+rnd()*.75;obstacle(x,y,45+rnd()*60,45+rnd()*60,'tree',true,{scale:s})}
for(let i=0;i<260;i++){const x=rnd()*7100,y=rnd()*4700;if(x>700&&x<2250&&y>700&&y<1750)continue;deco(x,y,rnd()<.55?'grass':'flower',.55+rnd()*.75,{hue:rnd()})}
for(let i=0;i<95;i++){const x=4680-35+rnd()*35,y=180+30+rnd()*(1120-60);deco(x,y,'reed',.8+rnd()*.7)}

rebuildCollisionGrid();

const npc={x:1120,y:1110,anim:0,name:'Eira'};
const signposts=[{x:850,y:1230,text:'ASHEN WILDS'},{x:2060,y:1220,text:'NORTH ROAD'},{x:4600,y:1450,text:'BLACKWATER'}];
const chests=[{x:1320,y:1160,open:false,glow:0},{x:2320,y:1540,open:false,glow:1.7},{x:3020,y:980,open:false,glow:3.1},{x:4050,y:1680,open:false,glow:4.6},{x:5350,y:1180,open:false,glow:5.9},{x:6040,y:2740,open:false,glow:7.2}];
const regions=[{name:'ASHEN WILDS',x:0,y:0,w:2800,h:4800},{name:'OLD RUINS',x:2800,y:0,w:1700,h:4800},{name:'BLACKWATER',x:4500,y:0,w:2700,h:4800}];

/* Collision system */
function circleRect(x,y,r,o){const nx=Math.max(o.x,Math.min(x,o.x+o.w)),ny=Math.max(o.y,Math.min(y,o.y+o.h));return (x-nx)**2+(y-ny)**2<r*r}
function blocked(x,y,r,ignoreId=-1){if(x<r+20||y<r+20||x>world.w-r-20||y>world.h-r-20)return true;const nearby=getNearbyObstacles(x,y,r);for(const o of nearby)if(o.solid&&o.id!==ignoreId&&circleRect(x,y,r+2,o))return true;return false}
function moveBody(obj,dx,dy,r){let moved=false;if(dx){const nx=obj.x+dx;if(!blocked(nx,obj.y,r,obj.ignoreId)){obj.x=nx;moved=true}}if(dy){const ny=obj.y+dy;if(!blocked(obj.x,ny,r,obj.ignoreId)){obj.y=ny;moved=true}}return moved}
function safeSpawn(x,y,r=20){if(!blocked(x,y,r))return{x,y};for(let ring=1;ring<20;ring++){const rr=ring*45;for(let a=0;a<Math.PI*2;a+=Math.PI/6){const nx=x+Math.cos(a)*rr,ny=y+Math.sin(a)*rr;if(!blocked(nx,ny,r))return{x:nx,y:ny}}}return{x,y}}
const start=safeSpawn(p.x,p.y,p.r);p.x=start.x;p.y=start.y;

/* Enemy system with improved telegraph */
const enemyTypes={wolf:{name:'Schattenwolf',hp:80,damage:11,xp:38,gold:8,speed:128,r:21,aggro:600,color:'#5c4a7d'},skeleton:{name:'Knochenwächter',hp:145,damage:16,xp:68,gold:15,speed:78,r:23,aggro:550,color:'#c6ccce'},beast:{name:'Bestie',hp:220,damage:22,xp:120,gold:35,speed:95,r:26,aggro:700,color:'#963b2f'},wraith:{name:'Schattenwesen',hp:110,damage:18,xp:85,gold:20,speed:160,r:20,aggro:650,color:'#4cb8d0'}};
const enemies=[];
function spawnEnemy(forceKind=null){for(let tries=0;tries<180;tries++){const keysT=Object.keys(enemyTypes),kind=forceKind||keysT[(rnd()*keysT.length)|0],t=enemyTypes[kind];let x=180+rnd()*(world.w-360),y=180+rnd()*(world.h-360);if(!blocked(x,y,t.r)){enemies.push({...t,id:enemies.length,x,y,vx:0,vy:0,a:0,cd:0,hit:0,dead:false,deathT:0,telegraph:0,attackFlash:0,kind});break}}}
function distXY(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
for(let i=0;i<CONFIG.enemy.baseSpawns;i++)spawnEnemy();

/* Items & Equipment system */
const items={iron_sword:{name:'Iron Blade',type:'weapon',power:12,weight:1.8},ash_blade:{name:'Ash Blade',type:'weapon',power:28,weight:1.4},ruin_ring:{name:'Ruin Ring',type:'armor',power:4,weight:.2},wolf_pelt:{name:'Wolf Pelt',type:'material',power:0,weight:.6},blackwater_herb:{name:'Blackwater Herb',type:'consumable',power:18,weight:.1},water_flask:{name:'Water Flask',type:'consumable',power:8,weight:.5}};
function getEquippedDamage(){const eq=saveData.equipment||{};const weapon=items[eq.weapon];return weapon?p.attack+weapon.power:p.attack}
function applyItemBonus(){const eq=saveData.equipment||{};if(eq.weapon&&items[eq.weapon])p.attack=p.attack+items[eq.weapon].power;if(eq.armor&&items[eq.armor])p.maxHp+=items[eq.armor].power}

/* Effects */
const particles=[],texts=[],rings=[],slashes=[],embers=[],footprints=[],sparks=[];
function particle(x,y,color,count=12,power=160,size=2){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=20+Math.random()*power;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.3+Math.random()*.5,color,size})}}
function textFX(x,y,text,color='#fff',size=16){texts.push({x,y,text,color,size,l:1.15,vy:28})}
function ringFX(x,y,r=20,color='#fff'){rings.push({x,y,r,l:.65,color})}
function slashFX(x,y,angle,color='#dff8ff'){slashes.push({x,y,angle,l:.25,color})}
for(let i=0;i<90;i++)embers.push({x:rnd()*world.w,y:rnd()*world.h,phase:rnd()*Math.PI*2,s:rnd()*.7+.3});

/* Gameplay */
function inputVector(){let x=(input.right?1:0)-(input.left?1:0),y=(input.down?1:0)-(input.up?1:0);const l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:null}
function approach(v,t,a){return v<t?Math.min(v+a,t):Math.max(v-a,t)}
function updatePlayer(dt){if(p.dead)return;const q=inputVector();if(q){p.vx=approach(p.vx,q.x*p.speed,p.acc*dt);p.vy=approach(p.vy,q.y*p.speed,p.acc*dt);if(Math.abs(q.x)>Math.abs(q.y))p.dir=q.x>0?'right':q.x<0?'left':p.dir;else p.dir=q.y>0?'down':q.y<0?'up':p.dir;p.step+=distXY(0,0,p.vx,p.vy)*dt}else{p.vx*=Math.pow(1-CONFIG.player.fric/1000,dt);p.vy*=Math.pow(1-CONFIG.player.fric/1000,dt)}p.inv=Math.max(0,p.inv-dt);p.cd=Math.max(0,p.cd-dt);p.hurt=Math.max(0,p.hurt-dt);p.atk=Math.max(0,p.atk-dt);moveBody(p,p.vx*dt,p.vy*dt,p.r);cam.shake=Math.max(0,cam.shake-dt*2.5)}

function attack(){if(p.dead||p.cd>0)return;p.cd=CONFIG.combat.attackCooldown;p.atk=CONFIG.combat.attackDuration;const angle=dirAngle();slashFX(p.x,p.y,angle);particle(p.x+Math.cos(angle)*25,p.y+Math.sin(angle)*25,'#e8f8ff',8,120,2);let target=null,bestDist=50;for(const e of enemies){if(e.dead)continue;const d=distXY(p.x,p.y,e.x,e.y);if(d<bestDist){bestDist=d;target=e}}if(target)killEnemy(target,getEquippedDamage());saveData.kills++}

function dirAngle(){return p.dir==='right'?0:p.dir==='left'?Math.PI:p.dir==='up'?-Math.PI/2:Math.PI/2}

function killEnemy(e,dmg=p.attack){if(e.dead)return;e.dead=true;e.deathT=0;saveData.xp+=e.xp;saveData.gold+=e.gold;if(saveData.questKills<3)saveData.questKills++;textFX(e.x,e.y-45,'+'+e.xp+' XP','#ffe36a',18);particle(e.x,e.y,'#ffb36b',25,200,3);levelCheck();questCheck()}

function levelNeed(){return Math.round(110+(saveData.level-1)*55+Math.pow(saveData.level-1,1.35)*8)}
function levelCheck(){let need=levelNeed();while(saveData.xp>=need){saveData.xp-=need;saveData.level++;p.maxHp+=18;p.hp=p.maxHp;p.attack+=4;textFX(p.x,p.y,'+LEVEL','#ffd66e',20);ringFX(p.x,p.y,40,'#ffd66e');need=levelNeed()}}
function questCheck(){if(!saveData.questComplete&&saveData.questKills>=3){saveData.questComplete=true;saveData.gold+=150;saveData.potions+=2;saveData.xp+=200;particle(npc.x,npc.y,'#ffe36a',55,220,3);ringFX(npc.x,npc.y,50,'#ffd66e');msg('Quest Complete! Talk to Eira.')}}

function potion(){if(p.dead)return;if(saveData.potions<=0)return msg('No potions');if(p.hp>=p.maxHp)return msg('HP full');saveData.potions--;const heal=Math.min(70,p.maxHp-p.hp);p.hp+=heal;textFX(p.x,p.y-20,'+'+heal,'#71df9a',16);particle(p.x,p.y,'#71df9a',12,80,1.5);save()}

function enemyTelegraph(e,dt){if(e.dead)return;if(e.telegraph>0){e.telegraph=Math.max(0,e.telegraph-dt);if(e.telegraph<=0&&distXY(p.x,p.y,e.x,e.y)<e.r+p.r+18&&p.inv<=0)enemyHit(e)}}

function enemyAI(dt){for(const e of enemies){if(e.dead){e.deathT+=dt;continue}e.a+=dt*3;e.cd=Math.max(0,e.cd-dt);e.hit=Math.max(0,e.hit-dt);e.attackFlash=Math.max(0,e.attackFlash-dt);enemyTelegraph(e,dt);if(Math.abs(e.knock_x||0)<1)e.knock_x=0;if(Math.abs(e.knock_y||0)<1)e.knock_y=0;const d=distXY(p.x,p.y,e.x,e.y);if(d<e.aggro&&!p.dead){const dx=(p.x-e.x)/(d||1),dy=(p.y-e.y)/(d||1);e.vx=dx*e.speed*0.7;e.vy=dy*e.speed*0.7;if(e.cd<=0&&d<e.r+p.r+25){e.telegraph=CONFIG.combat.telegraghDuration;e.attackFlash=.15;particle(e.x,e.y,'#ffb06b',5,55,2)}}else{e.vx*=0.8;e.vy*=0.8}moveBody(e,e.vx*dt,e.vy*dt,e.r)}separateEnemies();for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&enemies[i].deathT>.7){enemies.splice(i,1);if(enemies.length<CONFIG.enemy.maxInstances)spawnEnemy()}}

function enemyHit(e){if(e.telegraph>0||e.dead||p.inv>0)return;p.hp=Math.max(0,p.hp-e.damage);p.inv=.5;p.hurt=.25;cam.shake=Math.max(cam.shake,9);textFX(p.x,p.y-40,'-'+e.damage,'#ff6670',16);particle(p.x,p.y,'#ff5565',13,140,2.5);if(p.hp<=0)die()}

function separateEnemies(){for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),minD=a.r+b.r;if(d<minD){const push=minD-d+1;a.x-=dx/d*push*.5;a.y-=dy/d*push*.5;b.x+=dx/d*push*.5;b.y+=dy/d*push*.5}}}}

function die(){if(p.dead)return;p.dead=true;p.vx=p.vy=0;clearInput();saveData.deaths++;saveData.gold=Math.max(0,saveData.gold-20);UI.death.style.display='flex';particle(p.x,p.y,'#ff5967',50,260,3);setTimeout(respawn,3000)}

function respawn(){p.dead=false;p.inv=2;const safe=safeSpawn(spawnPoint.x,spawnPoint.y,p.r);p.x=safe.x;p.y=safe.y;p.hp=p.maxHp;p.vx=0;p.vy=0;UI.death.style.display='none';save()}

/* Save/Load */
let autoSave=0;function save(){try{Object.assign(saveData,{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,attack:p.attack});localStorage.setItem(SAVE,JSON.stringify(saveData));UI.save.textContent='💾 Saved'}catch(e){UI.save.textContent='⚠ Save failed'}}
function resetGame(){if(confirm('Reset NEXORA completely?')){localStorage.removeItem(SAVE);location.reload()}}
function msg(t){UI.msg.textContent=t;UI.msg.style.opacity='1';clearTimeout(msg.timer);msg.timer=setTimeout(()=>UI.msg.style.opacity='0',1900)}

/* Camera */
function camera(dt){const maxX=Math.max(0,world.w-W),maxY=Math.max(0,world.h-H);const targetX=Math.max(0,Math.min(maxX,p.x-W*.5)),targetY=Math.max(0,Math.min(maxY,p.y-H*.5));const k=1-Math.pow(.00025,dt);cam.x+=(targetX-cam.x)*k;cam.y+=(targetY-cam.y)*k;cam.shake=Math.max(0,cam.shake-dt*8)}
function sx(x){return x-cam.x+(cam.shake?((Math.random()-.5)*cam.shake):0)}
function sy(y){return y-cam.y+(cam.shake?((Math.random()-.5)*cam.shake):0)}

/* Rendering */
function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function shadow(x,y,rx,ry,a=.3){X.fillStyle='rgba(0,0,0,'+a+')';X.beginPath();X.ellipse(x,y,rx,ry,0,0,Math.PI*2);X.fill()}

function terrain(){X.fillStyle='#18281f';X.fillRect(0,0,W,H);const grid=80,startX=Math.floor(cam.x/grid)*grid,startY=Math.floor(cam.y/grid)*grid;for(let y=startY;y<cam.y+H+grid;y+=grid)for(let x=startX;x<cam.x+W+grid;x+=grid){const n=hash(x/grid,y/grid);X.fillStyle=n<.3?'#1a3a2a':n<.6?'#1e342a':'#213c2e';X.fillRect(sx(x),sy(y),grid+2,grid+2)}}

function playerDraw(){const x=sx(p.x),y=sy(p.y);shadow(x,y+20,18,7,.35);X.save();if(p.inv>0)X.globalAlpha=.6+.4*Math.sin(elapsed*12);X.fillStyle='#4e337c';X.beginPath();X.ellipse(x,y,16,22,0,0,Math.PI*2);X.fill();X.strokeStyle='#6b5b95';X.lineWidth=2;X.stroke();X.restore()}

function effectsDraw(){for(const q of rings){X.globalAlpha=Math.max(0,q.l)*.7;X.strokeStyle=q.color;X.lineWidth=2.5;X.beginPath();X.arc(sx(q.x),sy(q.y),q.r,0,Math.PI*2);X.stroke()}for(const q of slashes){X.globalAlpha=Math.max(0,q.l)*.8;X.strokeStyle=q.color;X.lineWidth=3;X.beginPath();X.arc(sx(q.x),sy(q.y),30,q.angle-.6,q.angle+.6);X.stroke()}X.globalAlpha=1;for(const p of particles){X.fillStyle=p.color;X.globalAlpha=Math.max(0,p.l);X.beginPath();X.arc(sx(p.x),sy(p.y),p.size,0,Math.PI*2);X.fill()}for(const t of texts){X.save();X.globalAlpha=Math.max(0,t.l);X.fillStyle=t.color;X.font='bold '+t.size+'px Arial';X.textAlign='center';X.fillText(t.text,sx(t.x),sy(t.y));X.restore();t.y-=t.vy*elapsed;t.l-=elapsed*.5}}

function renderWorld(){terrain();const list=[];for(const o of obstacles){if(!((o.x+o.w>cam.x-100&&o.x<cam.x+W+100&&o.y+o.h>cam.y-100&&o.y<cam.y+H+100)))continue;let fn=null;if(o.type==='tree')fn=()=>{const x=sx(o.x+o.w/2),y=sy(o.y+o.h),s=Math.max(.7,o.w/42);shadow(x,y+7*s,25*s,9*s,.38);X.fillStyle='#513a29';roundRect(X,x-7*s,y-37*s,14*s,35*s,3*s);X.fill();X.fillStyle='#2d5a1f';X.beginPath();X.ellipse(x,y-20*s,30*s,32*s,0,0,Math.PI*2);X.fill()};else if(o.type==='rock')fn=()=>{const x=sx(o.x),y=sy(o.y);shadow(x+o.w/2,y+o.h+5,o.w*.46,7,.4);X.fillStyle='#687178';roundRect(X,x,y,o.w,o.h,4);X.fill()};else if(o.type==='building'||o.type==='inn'||o.type==='house'||o.type==='smith'||o.type==='warehouse'||o.type==='ruin'||o.type==='fort')fn=()=>{const x=sx(o.x),y=sy(o.y);shadow(x+o.w*.5,y+o.h+8,o.w*.5,10,.35);X.fillStyle='#4a4340';roundRect(X,x,y,o.w,o.h,6);X.fill()};if(fn)list.push({y:o.y+o.h,fn})}for(const e of enemies){if(e.dead)continue;if(!((e.x-60>cam.x-100&&e.x+60<cam.x+W+100&&e.y-60>cam.y-100&&e.y+60<cam.y+H+100)))continue;list.push({y:e.y+e.r,fn:()=>{const x=sx(e.x),y=sy(e.y);shadow(x,y+e.r+3,e.r*1.2,e.r*.4,.35);X.save();if(e.telegraph>0){X.globalAlpha=.4+.3*Math.sin(e.telegraph*20);X.strokeStyle='#ffb36b';X.lineWidth=3;X.beginPath();X.arc(x,y,e.r+6,0,Math.PI*2);X.stroke()}X.globalAlpha=1;X.fillStyle=e.hit?'#fff':e.color;X.beginPath();X.ellipse(x,y,e.r,e.r*.8,0,0,Math.PI*2);X.fill();X.restore()}})}list.push({y:p.y+p.r,fn:playerDraw});for(const c of chests){if(!((c.x>cam.x-100&&c.x<cam.x+W+100&&c.y>cam.y-100&&c.y<cam.y+H+100)))continue;list.push({y:c.y+15,fn:()=>{const x=sx(c.x),y=sy(c.y);shadow(x,y+10,20,6,.3);X.fillStyle='#8b6f47';X.fillRect(x-15,y-10,30,20);if(!c.open)X.fillStyle='#a89968';else X.fillStyle='#6b5a3a';X.fillRect(x-12,y-7,24,12)}})}list.sort((a,b)=>a.y-b.y);for(const item of list)item.fn();effectsDraw()}

function updateFX(dt){for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.04,dt);q.vy*=Math.pow(.04,dt);q.l-=dt;if(q.l<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.l-=dt;if(q.l<=0)texts.splice(i,1)}for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.r+=100*dt;q.l-=dt;if(q.l<=0)rings.splice(i,1)}for(let i=slashes.length-1;i>=0;i--){const q=slashes[i];q.l-=dt;if(q.l<=0)slashes.splice(i,1)}}

function minimap(){MX.clearRect(0,0,440,300);MX.fillStyle='#101b15';MX.fillRect(0,0,440,300);const sxm=440/world.w,sym=300/world.h;MX.fillStyle='#ff6666';MX.fillRect(p.x*sxm-3,p.y*sym-3,6,6);for(const e of enemies){if(e.dead)continue;MX.fillStyle='#ffaa00';MX.fillRect(e.x*sxm-2,e.y*sym-2,4,4)}}

function currentZone(){for(const r of regions)if(p.x>=r.x&&p.x<r.x+r.w&&p.y>=r.y&&p.y<r.y+r.h)return r.name;return 'ASHEN WILDS'}

function hud(){const hp=Math.max(0,p.hp/p.maxHp),need=levelNeed();UI.hpBar.style.width=hp*100+'%';UI.xpBar.style.width=Math.min(1,saveData.xp/need)*100+'%';UI.hpText.textContent=Math.ceil(p.hp)+' / '+Math.ceil(p.maxHp);UI.xpText.textContent=saveData.level;document.getElementById('zone').textContent=currentZone()}

let frameCount=0;function loop(now){const dt=Math.min(.045,Math.max(0,(now-last)/1000));last=now;if(document.hidden)return;try{updatePlayer(dt);enemyAI(dt);updateFX(dt);camera(dt);autoSave+=dt;if(autoSave>CONFIG.autosave){autoSave=0;save()}}catch(e){console.error('UPDATE:',e)}try{renderWorld()}catch(e){console.error('RENDER:',e)}try{minimap();hud()}catch(e){console.error('HUD:',e)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// Initialize
applyItemBonus();
</script>
</body>
</html>
