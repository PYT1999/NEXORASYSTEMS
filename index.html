<script>
'use strict';

const C=document.getElementById('game'),X=C.getContext('2d',{alpha:false}),M=document.getElementById('mini'),MX=M.getContext('2d');
const UI={hpBar:document.getElementById('hpBar'),xpBar:document.getElementById('xpBar'),hpText:document.getElementById('hpText'),xpText:document.getElementById('xpText'),level:document.getElementById('level'),attack:document.getElementById('attackText'),gold:document.getElementById('gold'),potions:document.getElementById('potions'),kills:document.getElementById('kills'),deaths:document.getElementById('deaths'),quest:document.getElementById('questText'),save:document.getElementById('save'),msg:document.getElementById('msg'),interact:document.getElementById('interact'),zone:document.getElementById('zone'),death:document.getElementById('death')};
let W=innerWidth,H=innerHeight,D=Math.min(2,devicePixelRatio||1),last=performance.now(),elapsed=0;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=Math.max(1,Math.floor(W*D));C.height=Math.max(1,Math.floor(H*D));X.setTransform(D,0,0,D,0,0);M.width=440;M.height=300}addEventListener('resize',resize);resize();
const world={w:7200,h:4800};
const SAVE='nexora_save_v1500';
const legacy=['nexora_save_v501','nexora_save_v10'];
const spawnPoint={x:1050,y:1450};
const water={x:4680,y:180,w:1260,h:1120};
const def={level:1,xp:0,gold:40,potions:4,kills:0,deaths:0,maxHp:120,hp:120,attack:28,x:spawnPoint.x,y:spawnPoint.y,questKills:0,questComplete:false};
let saveData={...def};
try{let raw=localStorage.getItem(SAVE);if(!raw){for(const k of legacy){raw=localStorage.getItem(k);if(raw)break}}if(raw)saveData={...def,...JSON.parse(raw)}}catch(e){saveData={...def}};
function num(v,d){const n=Number(v);return Number.isFinite(n)?n:d}
const p={x:num(saveData.x,spawnPoint.x),y:num(saveData.y,spawnPoint.y),r:20,speed:315,vx:0,vy:0,acc:2050,fric:1750,hp:num(saveData.hp,120),maxHp:num(saveData.maxHp,120),attack:num(saveData.attack,28),dir:'down',step:0,idle:0,atk:0,cd:0,inv:0,hurt:0,dead:false,respawn:0,trail:0};
p.hp=Math.max(0,Math.min(p.maxHp,p.hp));
const cam={x:0,y:0,shake:0};
const input={up:false,down:false,left:false,right:false};
const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
function clearInput(){input.up=input.down=input.left=input.right=false;for(const k in keys)keys[k]=false;p.vx=0;p.vy=0}
const keys=Object.create(null);
addEventListener('blur',clearInput);addEventListener('pointerup',()=>{input.up=input.down=input.left=input.right=false});addEventListener('pointercancel',()=>{input.up=input.down=input.left=input.right=false});
addEventListener('visibilitychange',()=>{clearInput();last=performance.now()});
addEventListener('keydown',e=>{const k=keyMap[e.key]||keyMap[e.code];if(k){input[k]=true;keys[e.key]=true;e.preventDefault()}if(e.code==='Space'&&!e.repeat){e.preventDefault();attack()}if(e.key.toLowerCase()==='q'&&!e.repeat)potion();if(e.key.toLowerCase()==='e'&&!e.repeat)talk();if(e.key.toLowerCase()==='r'&&!e.repeat)resetGame()});
addEventListener('keyup',e=>{const k=keyMap[e.key]||keyMap[e.code];if(k)input[k]=false;keys[e.key]=false});
document.querySelectorAll('.move').forEach(btn=>{const k=btn.dataset.k;const down=e=>{e.preventDefault();input[k]=true;try{btn.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();input[k]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});
document.getElementById('attack').addEventListener('click',attack);document.getElementById('potion').addEventListener('click',potion);addEventListener('beforeunload',save);
/* ---------- deterministic world generation ---------- */
let seed=1357911;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function hash(x,y){let n=(x*374761393+y*668265263)>>>0;n=(n^(n>>13))*1274126177>>>0;return ((n^(n>>16))>>>0)/4294967296}
const obstacles=[],decor=[],regions=[];
function obstacle(x,y,w,h,type,solid=true,extra={}){obstacles.push({x,y,w,h,type,solid,id:obstacles.length,...extra})}
function deco(x,y,type,scale=1,extra={}){decor.push({x,y,type,scale,id:decor.length,...extra})}
/* Roads / landmarks */
obstacle(760,1080,1450,420,'villageGround',false);obstacle(1960,0,260,4800,'road',false);obstacle(0,1270,7200,230,'road',false);obstacle(4680,180,1260,1120,'water',false);
/* village buildings */
const buildings=[
 [900,780,420,300,'inn'],[1430,780,360,280,'house'],[1030,1370,390,290,'house'],[1510,1380,330,260,'smith'],[650,1480,250,210,'house'],[1780,1120,300,350,'warehouse']
];
for(const b of buildings)obstacle(...b,true);
/* stone ruins */
obstacle(3250,710,360,260,'ruin');obstacle(3530,850,310,210,'ruin');obstacle(5700,2300,500,360,'fort');
/* rocks */
for(let i=0;i<65;i++){const x=250+rnd()*6500,y=250+rnd()*4200,w=38+rnd()*90,h=30+rnd()*65;if(x>600&&x<2200&&y>650&&y<1750)continue;if(x>4550&&x<6100&&y<1450)continue;obstacle(x,y,w,h,'rock')}
/* forests: clustered, but never block roads or spawn area */
for(let i=0;i<520;i++){const x=120+rnd()*6900,y=120+rnd()*4500;if(x>620&&x<2200&&y>650&&y<1750)continue;if(x>1880&&x<2240)continue;if(x>4650&&x<6000&&y<1420)continue;const s=.75+rnd()*.75;obstacle(x,y,38*s,38*s,'tree');deco(x+19*s,y-10*s,'grass',.7+rnd()*.8)}
/* special vegetation */
for(let i=0;i<260;i++){const x=rnd()*7100,y=rnd()*4700;if(x>700&&x<2250&&y>700&&y<1750)continue;deco(x,y,rnd()<.55?'grass':'flower',.55+rnd()*.75,{hue:rnd()})}
/* shoreline reeds */
for(let i=0;i<95;i++){const x=water.x-35+rnd()*35,y=water.y+30+rnd()*(water.h-60);deco(x,y,'reed',.8+rnd()*.7)}
const npc={x:1120,y:1110,anim:0,name:'Eira'};
const signposts=[{x:850,y:1230,text:'ASHEN WILDS'},{x:2060,y:1220,text:'NORTH ROAD'},{x:4600,y:1450,text:'BLACKWATER'}];
regions.push({name:'ASHEN WILDS',x:0,y:0,w:2800,h:4800});regions.push({name:'OLD RUINS',x:2800,y:0,w:1700,h:4800});regions.push({name:'BLACKWATER',x:4500,y:0,w:2700,h:4800});
/* ---------- collision ---------- */
function circleRect(x,y,r,o){const nx=Math.max(o.x,Math.min(x,o.x+o.w)),ny=Math.max(o.y,Math.min(y,o.y+o.h));return (x-nx)**2+(y-ny)**2<r*r}
function blocked(x,y,r,ignoreId=-1){if(x<r+20||y<r+20||x>world.w-r-20||y>world.h-r-20)return true;for(const o of obstacles)if(o.solid&&o.id!==ignoreId&&circleRect(x,y,r+2,o))return true;return false}
function moveBody(obj,dx,dy,r){let moved=false;if(dx){const nx=obj.x+dx;if(!blocked(nx,obj.y,r,obj.ignoreId)){obj.x=nx;moved=true}}if(dy){const ny=obj.y+dy;if(!blocked(obj.x,ny,r,obj.ignoreId)){obj.y=ny;moved=true}}return moved}
function safeSpawn(x,y,r=20){if(!blocked(x,y,r))return{x,y};for(let ring=1;ring<20;ring++){const rr=ring*45;for(let a=0;a<Math.PI*2;a+=Math.PI/6){const nx=x+Math.cos(a)*rr,ny=y+Math.sin(a)*rr;if(!blocked(nx,ny,r))return{x:nx,y:ny}}}return{x:spawnPoint.x,y:spawnPoint.y}
const start=safeSpawn(p.x,p.y,p.r);p.x=start.x;p.y=start.y;
/* ---------- enemies ---------- */
const enemyTypes={wolf:{name:'Schattenwolf',hp:80,damage:11,xp:38,gold:8,speed:128,r:21,aggro:600,color:'#5c4a7d'},skeleton:{name:'Knochenwächter',hp:145,damage:16,xp:68,gold:15,speed:78,r:23,aggro:560,color:'#b7bec2'},beast:{name:'Aschenbestie',hp:220,damage:23,xp:105,gold:28,speed:92,r:29,aggro:690,color:'#9a3e31'},wraith:{name:'Nachtgeist',hp:115,damage:18,xp:82,gold:21,speed:108,r:20,aggro:760,color:'#5cc5d8'}};
const enemies=[];
function spawnEnemy(forceKind=null){for(let tries=0;tries<180;tries++){const keysT=Object.keys(enemyTypes),kind=forceKind||keysT[(rnd()*keysT.length)|0],t=enemyTypes[kind];let x=180+rnd()*(world.w-360),y=180+rnd()*(world.h-360);if(distXY(x,y,p.x,p.y)<850||blocked(x,y,t.r)||circleRect(x,y,t.r,water))continue;let tooClose=false;for(const e of enemies)if(!e.dead&&distXY(x,y,e.x,e.y)<110){tooClose=true;break}if(tooClose)continue;enemies.push({kind,...t,maxHp:t.hp,hp:t.hp,x,y,r:t.r,cd:rnd(),hit:0,dead:false,deathT:0,a:rnd()*Math.PI*2,dir:0,knockX:0,knockY:0,alert:0,attackFlash:0});return true}return false}
function distXY(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}
for(let i=0;i<42;i++)spawnEnemy();
/* ---------- effects ---------- */
const particles=[],texts=[],rings=[],slashes=[],embers=[];
function particle(x,y,color,count=12,power=160,size=2){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=20+Math.random()*power;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.3+Math.random()*.65,ml:.95,color,size:size*(.65+Math.random())})}}
function textFX(x,y,text,color='#fff',size=16){texts.push({x,y,text,color,size,l:1.15,vy:28})}
function ringFX(x,y,r=20,color='#fff'){rings.push({x,y,r,l:.65,color})}
function slashFX(x,y,angle,color='#dff8ff'){slashes.push({x,y,angle,l:.25,color})}
for(let i=0;i<90;i++)embers.push({x:rnd()*world.w,y:rnd()*world.h,phase:rnd()*Math.PI*2,s:rnd()*.7+.3});
/* ---------- gameplay ---------- */
function inputVector(){let x=(input.right?1:0)-(input.left?1:0),y=(input.down?1:0)-(input.up?1:0);const l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:null}
function approach(v,t,a){return v<t?Math.min(v+a,t):Math.max(v-a,t)}
function updatePlayer(dt){if(p.dead)return;const q=inputVector();if(q){p.vx=approach(p.vx,q.x*p.speed,p.acc*dt);p.vy=approach(p.vy,q.y*p.speed,p.acc*dt);if(Math.abs(q.x)>Math.abs(q.y))p.dir=q.x>0?'right':'left';else p.dir=q.y>0?'down':'up';p.idle=0}else{p.vx=approach(p.vx,0,p.fric*dt);p.vy=approach(p.vy,0,p.fric*dt);p.idle+=dt}const sp=Math.hypot(p.vx,p.vy);if(sp>5)p.step+=dt*(6.5+sp/p.speed*10);moveBody(p,p.vx*dt,p.vy*dt,p.r);if(sp>10)p.trail+=dt;else p.trail=0;p.cd=Math.max(0,p.cd-dt);p.atk=Math.max(0,p.atk-dt);p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt)}
function attack(){if(p.dead||p.cd>0)return;p.cd=.31;p.atk=.28;const angle=dirAngle();slashFX(p.x,p.y,angle);particle(p.x+Math.cos(angle)*25,p.y+Math.sin(angle)*25,'#e8f8ff',8,120,2);let target=null,best=Infinity;for(const e of enemies){if(e.dead)continue;const d=distXY(p.x,p.y,e.x,e.y);const ad=Math.atan2(e.y-p.y,e.x-p.x);const diff=Math.abs(Math.atan2(Math.sin(ad-angle),Math.cos(ad-angle)));if(d<138&&diff<1.25&&d<best){best=d;target=e}}if(!target){msg('Kein Gegner im Angriffswinkel');return}const damage=Math.max(1,Math.round(p.attack+Math.random()*12));target.hp-=damage;target.hit=.16;target.attackFlash=.12;const push=28;target.knockX=Math.cos(angle)*push;target.knockY=Math.sin(angle)*push;textFX(target.x,target.y-42,'-'+damage,'#ffd166',16);particle(target.x,target.y,'#ffcb69',15,150,2.4);cam.shake=Math.max(cam.shake,7);if(target.hp<=0)killEnemy(target)}
function dirAngle(){return p.dir==='right'?0:p.dir==='left'?Math.PI:p.dir==='up'?-Math.PI/2:Math.PI/2}
function killEnemy(e){if(e.dead)return;e.dead=true;e.deathT=0;saveData.xp+=e.xp;saveData.gold+=e.gold;saveData.kills++;if(saveData.questKills<3)saveData.questKills++;textFX(e.x,e.y-45,'+'+e.xp+' XP','#6ee7ff',15);particle(e.x,e.y,'#b27aff',32,230,3);ringFX(e.x,e.y,35,'#b27aff');if(Math.random()<.16){saveData.potions++;msg('🧪 Trank gefunden')}else msg('+'+e.gold+' Gold · +'+e.xp+' XP');levelCheck();questCheck();save()}
function levelNeed(){return Math.round(110+(saveData.level-1)*55+Math.pow(saveData.level-1,1.35)*8)}
function levelCheck(){let need=levelNeed();let leveled=false;while(saveData.xp>=need){saveData.xp-=need;saveData.level++;p.maxHp+=18;p.hp=p.maxHp;p.attack+=4;leveled=true;need=levelNeed()}if(leveled){particle(p.x,p.y,'#ffe36a',60,260,3);ringFX(p.x,p.y,80,'#ffe36a');msg('🔥 LEVEL '+saveData.level+' · Stärke gewachsen');save()}}
function questCheck(){if(!saveData.questComplete&&saveData.questKills>=3){saveData.questComplete=true;saveData.gold+=150;saveData.potions+=2;saveData.xp+=200;particle(npc.x,npc.y,'#ffe36a',55,220,3);ringFX(npc.x,npc.y,80,'#ffe36a');msg('⭐ QUEST ABGESCHLOSSEN · +150 Gold');levelCheck();save()}}
function talk(){if(distXY(p.x,p.y,npc.x,npc.y)>145){msg('Eira ist zu weit entfernt');return}if(!saveData.questComplete){if(saveData.questKills<3)msg('Eira: Die Schattenwesen bedrohen das Dorf.');else questCheck()}else msg('Eira: Die Asche wird niemals vergessen.')}
function potion(){if(p.dead)return;if(saveData.potions<=0)return msg('Keine Tränke vorhanden');if(p.hp>=p.maxHp)return msg('HP bereits voll');saveData.potions--;const heal=Math.min(70,p.maxHp-p.hp);p.hp+=heal;particle(p.x,p.y,'#61e99a',25,150,2.5);ringFX(p.x,p.y,38,'#61e99a');textFX(p.x,p.y-34,'+'+heal+' HP','#6ff0a0',15);msg('+'+heal+' HP · Trank');save()}
function enemyAI(dt){for(const e of enemies){if(e.dead){e.deathT+=dt;continue}e.a+=dt*3;e.cd=Math.max(0,e.cd-dt);e.hit=Math.max(0,e.hit-dt);e.attackFlash=Math.max(0,e.attackFlash-dt);if(Math.abs(e.knockX)+Math.abs(e.knockY)>1){const mx=e.knockX*dt*5,my=e.knockY*dt*5;moveBody(e,mx,my,e.r);e.knockX*=Math.pow(.02,dt);e.knockY*=Math.pow(.02,dt)}const dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy);if(p.dead)continue;if(dd<e.aggro){e.alert=Math.min(1,e.alert+dt*2);if(dd>e.r+p.r+12){const nx=dx/(dd||1),ny=dy/(dd||1);let strafe=Math.sin(e.a*1.7+e.id)*.18;let tx=(nx-ny*strafe)*e.speed*dt,ty=(ny+nx*strafe)*e.speed*dt;moveBody(e,tx,ty,e.r);e.dir=Math.atan2(dy,dx)}else if(e.cd<=0&&p.inv<=0){enemyHit(e)}}else e.alert=Math.max(0,e.alert-dt);}
  separateEnemies();
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead&&enemies[i].deathT>.7){enemies.splice(i,1);spawnEnemy()}
}
function enemyHit(e){e.cd=1.05;p.hp=Math.max(0,p.hp-e.damage);p.inv=.5;p.hurt=.25;cam.shake=Math.max(cam.shake,9);textFX(p.x,p.y-40,'-'+e.damage,'#ff6670',16);particle(p.x,p.y,'#ff5565',13,140,2.5);if(p.hp<=0)die()}
function separateEnemies(){for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead)continue;for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r+5;if(d>0&&d<min){const z=(min-d)*.5,nx=dx/d,ny=dy/d;const ax=a.x-nx*z,ay=a.y-ny*z,bx=b.x+nx*z,by=b.y+ny*z;if(!blocked(ax,ay,a.r))a.x=ax;if(!blocked(bx,by,b.r)){b.x=bx;b.y=by}}}}}
function die(){if(p.dead)return;p.dead=true;p.vx=p.vy=0;clearInput();saveData.deaths++;saveData.gold=Math.max(0,saveData.gold-20);UI.death.style.display='flex';particle(p.x,p.y,'#ff5967',50,260,3);ringFX(p.x,p.y,85,'#ff5967');save();setTimeout(respawn,1150)}
function respawn(){p.dead=false;UI.death.style.display='none';const safe=safeSpawn(spawnPoint.x,spawnPoint.y,p.r);p.x=safe.x;p.y=safe.y;p.hp=p.maxHp;p.vx=p.vy=0;p.inv=2.5;p.hurt=0;p.atk=0;p.cd=.4;p.dir='down';p.step=0;p.idle=0;clearInput();camera(1);msg('✨ Wiederbelebt · Bewegung freigegeben');save()}
/* ---------- save ---------- */
let saveFlash=0;function save(){try{Object.assign(saveData,{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,attack:p.attack});localStorage.setItem(SAVE,JSON.stringify(saveData));UI.save.textContent='💾 Gespeichert';saveFlash=.9}catch(e){UI.save.textContent='⚠ Speicherfehler'}}
function resetGame(){if(confirm('NEXORA wirklich komplett zurücksetzen?')){localStorage.removeItem(SAVE);legacy.forEach(k=>localStorage.removeItem(k));location.reload()}}
function msg(t){UI.msg.textContent=t;UI.msg.style.opacity='1';clearTimeout(msg.timer);msg.timer=setTimeout(()=>UI.msg.style.opacity='0',1900)}
/* ---------- camera ---------- */
function camera(dt){const maxX=Math.max(0,world.w-W),maxY=Math.max(0,world.h-H);const targetX=Math.max(0,Math.min(maxX,p.x-W*.5)),targetY=Math.max(0,Math.min(maxY,p.y-H*.5));const k=1-Math.pow(.00025,Math.max(0,dt));cam.x+=(targetX-cam.x)*k;cam.y+=(targetY-cam.y)*k;cam.x=Math.max(0,Math.min(maxX,cam.x));cam.y=Math.max(0,Math.min(maxY,cam.y))}
function sx(x){return x-cam.x+(cam.shake?((Math.random()-.5)*cam.shake):0)}function sy(y){return y-cam.y+(cam.shake?((Math.random()-.5)*cam.shake):0)}
/* ---------- rendering helpers ---------- */
function roundRect(ctx,x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function shadow(x,y,rx,ry,a=.3){X.fillStyle='rgba(0,0,0,'+a+')';X.beginPath();X.ellipse(x,y,rx,ry,0,0,Math.PI*2);X.fill()}
function terrain(){X.fillStyle='#18281f';X.fillRect(0,0,W,H);const grid=80,startX=Math.floor(cam.x/grid)*grid,startY=Math.floor(cam.y/grid)*grid;for(let y=startY;y<cam.y+H+grid;y+=grid)for(let x=startX;x<cam.x+W+grid;x+=grid){const n=hash(Math.floor(x/grid),Math.floor(y/grid));X.fillStyle=n<.12?'#1a2c20':n<.4?'#1c3022':'#1e3324';X.fillRect(x-cam.x,y-cam.y,grid+1,grid+1);if(n>.72){X.fillStyle='rgba(83,118,72,.12)';for(let k=0;k<3;k++){const gx=x-cam.x+12+((n*1000+k*19)%55),gy=y-cam.y+15+((n*1700+k*23)%55);X.fillRect(gx,gy,1.5,8)}}}
  }
  /* roads */
  X.fillStyle='#5a4b38';X.fillRect(sx(0),sy(1270),world.w,230);X.fillRect(sx(1960),sy(0),260,world.h);X.fillStyle='rgba(176,145,94,.32)';X.fillRect(sx(0),sy(1365),world.w,5);X.fillRect(sx(2080),sy(0),5,world.h);X.fillStyle='rgba(30,22,17,.22)';for(let x=-100;x<world.w;x+=170)X.fillRect(sx(x),sy(1320+Math.sin(x)*3),85,3);
  /* village grass */
  X.fillStyle='rgba(117,151,77,.12)';X.fillRect(sx(760),sy(1080),1450,420);
  drawWater();drawShore();
  /* distant ember haze */
  for(const e of embers){const xx=sx(e.x),yy=sy(e.y);if(xx<-10||xx>W+10||yy<-10||yy>H+10)continue;const b=.15+.2*Math.sin(elapsed*.7+e.phase);X.fillStyle='rgba(255,133,65,'+b+')';X.fillRect(xx,yy,e.s,e.s)}
}
function drawWater(){const x=sx(water.x),y=sy(water.y);X.fillStyle='#0c3345';X.fillRect(x,y,water.w,water.h);const g=X.createLinearGradient(x,y,x+water.w,y+water.h);g.addColorStop(0,'rgba(50,134,157,.25)');g.addColorStop(.5,'rgba(8,47,68,.1)');g.addColorStop(1,'rgba(0,12,24,.35)');X.fillStyle=g;X.fillRect(x,y,water.w,water.h);for(let yy=water.y+28;yy<water.y+water.h;yy+=34){const phase=elapsed*1.7+yy*.014;for(let xx=water.x+20;xx<water.x+water.w-20;xx+=105){const off=Math.sin(phase+xx*.009)*9;X.strokeStyle='rgba(115,211,222,.22)';X.lineWidth=1.4;X.beginPath();X.moveTo(sx(xx)+off,sy(yy));X.quadraticCurveTo(sx(xx+25)+off,sy(yy-3),sx(xx+50)+off,sy(yy));X.stroke()}}}
function drawShore(){const x=sx(water.x),y=sy(water.y),w=water.w,h=water.h;X.strokeStyle='rgba(184,159,93,.45)';X.lineWidth=18;X.strokeRect(x+2,y+2,w-4,h-4);X.strokeStyle='rgba(225,202,130,.28)';X.lineWidth=3;X.strokeRect(x+4,y+4,w-8,h-8)}
function drawGroundDeco(o){const x=sx(o.x),y=sy(o.y),s=o.scale;X.save();X.globalAlpha=.5; if(o.type==='grass'){X.strokeStyle='#6b965c';X.lineWidth=1.3*s;for(let i=0;i<4;i++){const dx=(i-1.5)*3*s;X.beginPath();X.moveTo(x+dx,y+5*s);X.lineTo(x+dx-2*s,y-6*s);X.stroke()}}else if(o.type==='flower'){const petal=o.hue>.5?'#d18bb8':'#e4b95d';X.strokeStyle='#618554';X.lineWidth=1;X.beginPath();X.moveTo(x,y+6*s);X.lineTo(x,y-2*s);X.stroke();X.fillStyle=petal;X.beginPath();X.arc(x,y-4*s,2.5*s,0,Math.PI*2);X.fill()}else{X.strokeStyle='#75985b';X.lineWidth=2*s;for(let i=-1;i<=1;i++){X.beginPath();X.moveTo(x+i*4*s,y+7*s);X.lineTo(x+i*6*s,y-10*s);X.stroke()}}X.restore()}
function treeDraw(o){const x=sx(o.x+o.w/2),y=sy(o.y+o.h),s=Math.max(.7,o.w/42),sway=Math.sin(elapsed*1.4+o.id*.73)*2.2*s;shadow(x,y+7*s,25*s,9*s,.38);X.fillStyle='#513a29';roundRect(X,x-7*s,y-37*s,14*s,40*s,4*s);X.fill();X.fillStyle='#6b4a2f';X.fillRect(x-3*s,y-34*s,5*s,33*s);const layers=[[0,-54,32,'#173e27'],[-20,-38,25,'#1b4a2d'],[21,-36,24,'#1a472a'],[0,-24,31,'#235936'],[-7,-68,23,'#28663c']];for(const [dx,dy,r,c] of layers){X.fillStyle=c;X.beginPath();X.arc(x+dx*s+sway,y+dy*s,r*s,0,Math.PI*2);X.fill()}X.fillStyle='rgba(115,164,86,.45)';X.beginPath();X.arc(x-10*s+sway,y-67*s,7*s,0,Math.PI*2);X.fill()}
function rockDraw(o){const x=sx(o.x),y=sy(o.y);shadow(x+o.w/2,y+o.h+5,o.w*.46,7,.4);const g=X.createLinearGradient(x,y,x+o.w,y+o.h);g.addColorStop(0,'#9ca4a6');g.addColorStop(.45,'#687178');g.addColorStop(1,'#3d454a');X.fillStyle=g;X.beginPath();X.moveTo(x,y+o.h);X.lineTo(x+o.w*.15,y+o.h*.3);X.lineTo(x+o.w*.52,y);X.lineTo(x+o.w*.82,y+o.h*.18);X.lineTo(x+o.w,y+o.h);X.closePath();X.fill();X.strokeStyle='rgba(220,230,232,.18)';X.lineWidth=2;X.stroke()}
function buildingDraw(o){const x=sx(o.x),y=sy(o.y),w=o.w,h=o.h;shadow(x+w*.5,y+h+12,w*.58,12,.35);X.fillStyle='rgba(20,15,13,.55)';roundRect(X,x+10,y+16,w,h,8);X.fill();const wall=o.type==='inn'?'#6b5848':o.type==='smith'?'#50565a':o.type==='warehouse'?'#5c4c3e':o.type==='fort'?'#454a4c':'#68513f';X.fillStyle=wall;roundRect(X,x,y,w,h,7);X.fill();X.fillStyle=o.type==='fort'?'#303538':o.type==='smith'?'#3d3a38':'#7d3f38';X.beginPath();X.moveTo(x-24,y+12);X.lineTo(x+w*.5,y-75);X.lineTo(x+w+24,y+12);X.closePath();X.fill();X.fillStyle='rgba(255,185,106,.18)';X.fillRect(x+12,y+12,w-24,5);for(const wx of [x+42,x+w-84]){X.fillStyle='#b8d5d4';roundRect(X,wx,y+65,42,48,4);X.fill();X.fillStyle='rgba(18,36,40,.7)';X.fillRect(wx+18,y+65,5,48);X.fillRect(wx,y+85,42,4)}X.fillStyle='#3d2922';roundRect(X,x+w*.5-20,y+h-74,40,74,4);X.fill();if(o.type==='inn'){X.fillStyle='#d9b45f';X.font='bold 12px Arial';X.textAlign='center';X.fillText('THE ASHEN OAK',x+w/2,y+40)}if(o.type==='smith'){X.fillStyle='#efb04c';X.beginPath();X.arc(x+w-48,y+h-45,14,0,Math.PI*2);X.fill()}}
function ruinDraw(o){const x=sx(o.x),y=sy(o.y),w=o.w,h=o.h;shadow(x+w/2,y+h,w*.5,9,.35);X.fillStyle='#535b5e';roundRect(X,x,y,w,h,6);X.fill();X.fillStyle='#747b7b';for(let i=0;i<4;i++)X.fillRect(x+25+i*70,y+25,42,22);X.fillStyle='#252a2d';for(let i=0;i<3;i++)X.fillRect(x+38+i*105,y+90,55,100);X.strokeStyle='rgba(255,255,255,.08)';X.lineWidth=2;X.strokeRect(x,y,w,h)}
function fortDraw(o){const x=sx(o.x),y=sy(o.y),w=o.w,h=o.h;shadow(x+w/2,y+h,w*.6,14,.45);X.fillStyle='#383f42';X.fillRect(x,y,w,h);X.fillStyle='#596164';for(let i=0;i<8;i++)X.fillRect(x+i*65,y-22,48,30);X.fillStyle='#1e2528';X.fillRect(x+w/2-35,y+h-100,70,100);X.fillStyle='#9b3e35';X.fillRect(x+20,y+22,18,70)}
function signDraw(s){const x=sx(s.x),y=sy(s.y);shadow(x,y+13,14,5,.3);X.strokeStyle='#583a27';X.lineWidth=5;X.beginPath();X.moveTo(x,y+22);X.lineTo(x,y-8);X.stroke();X.fillStyle='#9a7447';roundRect(X,x-36,y-28,72,24,3);X.fill();X.fillStyle='#2e241c';X.font='bold 8px Arial';X.textAlign='center';X.fillText(s.text,x,y-12)}
function npcDraw(){const x=sx(npc.x),y=sy(npc.y),bob=Math.sin(npc.anim*2.7)*2;shadow(x,y+35,22,8,.4);X.fillStyle='#4e337c';X.beginPath();X.moveTo(x-21,y+31+bob);X.lineTo(x+21,y+31+bob);X.lineTo(x+15,y-5+bob);X.lineTo(x-15,y-5+bob);X.closePath();X.fill();X.fillStyle='#dca47e';X.beginPath();X.arc(x,y-20+bob,14,0,Math.PI*2);X.fill();X.fillStyle='#2b2035';X.beginPath();X.arc(x,y-25+bob,15,Math.PI,Math.PI*2);X.fill();X.fillStyle='#f6d26c';X.font='bold 12px Arial';X.textAlign='center';X.fillText('Eira',x,y-50+bob);if(distXY(p.x,p.y,npc.x,npc.y)<145){X.fillStyle='#fff';X.font='bold 16px Arial';X.fillText('E',x,y-67+bob)}}
function enemyDraw(e){const x=sx(e.x),y=sy(e.y),fade=e.dead?Math.max(0,1-e.deathT/.7):1;if(x<-160||x>W+160||y<-160||y>H+160)return;X.save();X.globalAlpha=fade;const bob=e.dead?0:Math.sin(e.a)*2,scale=e.r/21;shadow(x,y+e.r+8,e.r*.95,7,.4);if(e.kind==='wolf')drawWolf(x,y+bob,scale,e);else if(e.kind==='skeleton')drawSkeleton(x,y+bob,scale,e);else if(e.kind==='beast')drawBeast(x,y+bob,scale,e);else drawWraith(x,y+bob,scale,e);if(!e.dead){const bw=Math.max(48,e.r*2.5);X.fillStyle='rgba(5,8,10,.7)';X.fillRect(x-bw/2,y-e.r-26,bw,6);X.fillStyle='#e05058';X.fillRect(x-bw/2,y-e.r-26,bw*Math.max(0,e.hp/e.maxHp),6);X.fillStyle='#dce7ec';X.font='9px Arial';X.textAlign='center';X.fillText(e.name,x,y+e.r+25)}X.restore()}
function drawWolf(x,y,s,e){X.fillStyle=e.hit||e.attackFlash?'#fff':'#584276';X.beginPath();X.ellipse(x,y,s*29,s*17,0,0,Math.PI*2);X.fill();X.fillStyle='#684c8e';for(const side of [-1,1]){X.beginPath();X.moveTo(x+side*12*s,y-9*s);X.lineTo(x+side*25*s,y-32*s);X.lineTo(x+side*4*s,y-20*s);X.closePath();X.fill()}X.fillStyle='#f06c7a';X.beginPath();X.arc(x-8*s,y-3*s,2.7*s,0,7);X.arc(x+8*s,y-3*s,2.7*s,0,7);X.fill();X.strokeStyle='#34253f';X.lineWidth=3;X.beginPath();X.moveTo(x-20*s,y+9*s);X.quadraticCurveTo(x-34*s,y+18*s,x-42*s,y+4*s);X.stroke()}
function drawSkeleton(x,y,s,e){X.fillStyle=e.hit?'#fff':'#c6ccce';X.beginPath();X.arc(x,y-10*s,14*s,0,Math.PI*2);X.fill();X.fillRect(x-11*s,y+4*s,22*s,27*s);X.strokeStyle='#6d7478';X.lineWidth=3*s;for(let i=-6;i<=6;i+=6){X.beginPath();X.moveTo(x+i*s,y+7*s);X.lineTo(x+i*s,y+26*s);X.stroke()}X.fillStyle='#252a2e';X.fillRect(x-8*s,y-13*s,5*s,6*s);X.fillRect(x+3*s,y-13*s,5*s,6*s);X.strokeStyle='#aeb6b9';X.beginPath();X.moveTo(x-14*s,y+35*s);X.lineTo(x-23*s,y+48*s);X.moveTo(x+14*s,y+35*s);X.lineTo(x+23*s,y+48*s);X.stroke()}

  const left=Math.floor(cam.x/120)*120,top=Math.floor(cam.y/120)*120;
  for(let y=top;y<cam.y+H+120;y+=120)for(let x=left;x<cam.x+W+120;x+=120){
    const n=hash(Math.floor(x/120)+91,Math.floor(y/120)+17);
    if(n>.55){const xx=sx(x+15+n*80),yy=sy(y+20+n*75);X.fillStyle='rgba(115,137,92,'+(n*.06)+')';X.beginPath();X.ellipse(xx,yy,12+n*13,4+n*5,n*3,0,Math.PI*2);X.fill()}
    if(n<.08){const xx=sx(x+40),yy=sy(y+50);X.fillStyle='rgba(120,120,112,.2)';X.beginPath();X.ellipse(xx,yy,5,3,0,0,Math.PI*2);X.fill()}
  }
}

function drawWaterFoam(){
  const x=sx(water.x),y=sy(water.y);
  X.save();X.globalAlpha=.35;X.strokeStyle='#b4e5e2';X.lineWidth=2;
  for(let i=0;i<18;i++){const yy=water.y+40+i*62+Math.sin(elapsed*1.5+i)*5;X.beginPath();X.moveTo(x+10,sy(yy));X.quadraticCurveTo(x+80,sy(yy-5),x+145,sy(yy));X.stroke()}
  X.restore();
}

function enhancedUpdate(dt){
  elapsed+=dt;
  updateWeather(dt);
  updatePlayer(dt);
  enemyAI(dt);
  updateFX(dt);
  npc.anim+=dt;
  camera(dt);
  /* gentle footstep particles */
  if(Math.hypot(p.vx,p.vy)>170&&Math.random()<dt*5){particles.push({x:p.x+(Math.random()-.5)*12,y:p.y+17,vx:(Math.random()-.5)*15,vy:6,l:.22,ml:.22,color:'#8e9b86',size:1.3})}
  autoSave+=dt;if(autoSave>6){autoSave=0;save()}
}

function enhancedRender(){
  terrain();
  terrainDetail();
  drawClouds();
  drawWaterFoam();

  for(const o of obstacles){
    if(o.x+o.w<cam.x-220||o.x>cam.x+W+220||o.y+o.h<cam.y-220||o.y>cam.y+H+220)continue;
    if(o.type==='tree')list.push({y:o.y+o.h+8,fn:()=>treeDraw(o)});
    else if(o.type==='rock')list.push({y:o.y+o.h,fn:()=>rockDraw(o)});

    else if(o.type==='fort')list.push({y:o.y+o.h,fn:()=>fortDraw(o)});

/* Prevent the visual layer from creating an impossible spawn after legacy saves. */
function validatePlayerPosition(){
  if(blocked(p.x,p.y,p.r)){const safe=safeSpawn(spawnPoint.x,spawnPoint.y,p.r);p.x=safe.x;p.y=safe.y;p.vx=p.vy=0;clearInput()}
}

const stamina={value:100,max:100,regen:22,dodgeCost:28,dodge:0};
const worldState={fogDensity:.035,windX:0,windY:0,temperature:.5,thunder:0,weatherClock:0};
const sparks=[];
const damageVignette={value:0};
const interaction={cooldown:0};
const cameraTarget={x:0,y:0};

/* A small procedural noise field makes the ground less uniform without textures. */
function noise2(x,y){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1);
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return lerp(lerp(a,b,ux),lerp(c,d,ux),uy)
}
function fbm(x,y){let value=0,amp=.5,freq=.015;for(let i=0;i<4;i++){value+=noise2(x*freq,y*freq)*amp;amp*=.5;freq*=2}return value}

function updateStamina(dt){
  const moving=!!inputVector();
  if(stamina.dodge>0)stamina.dodge=Math.max(0,stamina.dodge-dt);
  if(!moving)stamina.value=Math.min(stamina.max,stamina.value+stamina.regen*dt);
  else stamina.value=Math.min(stamina.max,stamina.value+stamina.regen*.55*dt);
}
function dodge(){
  if(p.dead||stamina.dodge>0||stamina.value<stamina.dodgeCost)return;
  const q=inputVector()||{x:p.dir==='right'?1:p.dir==='left'?-1:0,y:p.dir==='down'?1:p.dir==='up'?-1:0};
  stamina.value-=stamina.dodgeCost;stamina.dodge=.62;p.inv=Math.max(p.inv,.62);
  const burst=270;moveBody(p,q.x*burst*.18,q.y*burst*.18,p.r);
  particle(p.x,p.y,'#bcefff',18,120,2);ringFX(p.x,p.y,28,'#9ceaff');cam.shake=Math.max(cam.shake,4);
}
addEventListener('keydown',e=>{if(e.code==='ShiftLeft'||e.code==='ShiftRight')dodge()});

/* More deliberate enemy behaviour: a brief wind-up telegraphs attacks. */
function enemyTelegraph(e,dt){
  if(e.dead)return;
  e.telegraph=e.telegraph||0;
  if(e.telegraph>0){e.telegraph=Math.max(0,e.telegraph-dt);if(e.telegraph===0&&distXY(p.x,p.y,e.x,e.y)<e.r+p.r+18&&p.inv<=0)enemyHit(e)}
}
const originalEnemyAI=enemyAI;
enemyAI=function(dt){
  for(const e of enemies)if(!e.dead)enemyTelegraph(e,dt);
  originalEnemyAI(dt);
};
/* Override direct contact damage with a readable wind-up while preserving old cooldowns. */
const originalEnemyHit=enemyHit;
enemyHit=function(e){
  if(e.telegraph>0||e.dead||p.inv>0)return;
  e.telegraph=.18;e.attackFlash=.18;
  particle(e.x,e.y,'#ffb06b',5,55,2);
};

function updateLivingWorld(dt){
  worldState.weatherClock+=dt;
  worldState.windX=Math.sin(elapsed*.11)*.55+Math.sin(elapsed*.037)*.22;
  worldState.windY=Math.cos(elapsed*.08)*.16;
  worldState.fogDensity=.025+.018*(.5+.5*Math.sin(elapsed*.021));
  worldState.temperature=.5+.5*Math.sin(elapsed*.004);
  damageVignette.value=Math.max(0,damageVignette.value-dt*1.8);
  if(interaction.cooldown>0)interaction.cooldown-=dt;
  updateStamina(dt);
  stamina.dodge=Math.max(0,stamina.dodge-dt);
  if(Math.random()<dt*.7){
    sparks.push({x:p.x+(Math.random()-.5)*W*.7,y:p.y+(Math.random()-.5)*H*.7,vx:worldState.windX*18,vy:-4-Math.random()*12,l:1.2+Math.random()*1.8,ml:3,color:Math.random()<.7?'#ffb36b':'#bfeaff',size:.7+Math.random()*1.6});
  }
  for(let i=sparks.length-1;i>=0;i--){const q=sparks[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0)sparks.splice(i,1)}
}

function drawTerrainMicroDetail(){
  const startX=Math.floor(cam.x/48)*48,startY=Math.floor(cam.y/48)*48;
  for(let y=startY;y<cam.y+H+48;y+=48){
    for(let x=startX;x<cam.x+W+48;x+=48){
      const n=fbm(x,y);
      if(n>.61){const xx=sx(x+(n-.5)*35),yy=sy(y+(1-n)*30);X.fillStyle='rgba(123,151,101,'+((n-.61)*.16)+')';X.beginPath();X.ellipse(xx,yy,3+n*5,1.3+n*2,.3,0,Math.PI*2);X.fill()}
    }
  }
}
function drawAtmosphericSparks(){
  for(const q of sparks){const x=sx(q.x),y=sy(q.y);if(x<-30||x>W+30||y<-30||y>H+30)continue;X.save();X.globalAlpha=Math.max(0,q.l/q.ml);X.shadowBlur=7;X.shadowColor=q.color;X.fillStyle=q.color;X.beginPath();X.arc(x,y,q.size,0,Math.PI*2);X.fill();X.restore()}
}
function drawPlayerLight(){
  const x=sx(p.x),y=sy(p.y);
  const night=Math.max(0,-Math.sin((weather.time-6)/24*Math.PI*2));
  if(night<.08)return;
  const g=X.createRadialGradient(x,y,10,x,y,175);g.addColorStop(0,'rgba(255,211,130,.12)');g.addColorStop(.45,'rgba(255,145,75,.045)');g.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=g;X.beginPath();X.arc(x,y,175,0,Math.PI*2);X.fill();
}
function drawRainMist(){
  if(weather.rain<=.01)return;
  X.save();X.globalAlpha=.12*weather.rain;X.fillStyle='#bfe8ed';
  for(let i=0;i<20;i++){const x=(i*137+elapsed*50)%W,y=(i*73+elapsed*21)%H;X.beginPath();X.ellipse(x,y,18,3,0,0,Math.PI*2);X.fill()}
  X.restore();
}
function drawDamageVignette(){
  if(damageVignette.value<=0)return;
  const g=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.18,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(255,20,35,'+(.24*damageVignette.value)+')');X.fillStyle=g;X.fillRect(0,0,W,H);
}

/* Footprint history makes movement feel grounded. */
function recordFootprints(dt){
  if(p.dead)return;
  if(Math.hypot(p.vx,p.vy)>180&&Math.random()<dt*3){footprints.push({x:p.x+(Math.random()-.5)*8,y:p.y+19,l:1.5});if(footprints.length>80)footprints.shift()}
  for(let i=footprints.length-1;i>=0;i--){footprints[i].l-=dt;if(footprints[i].l<=0)footprints.splice(i,1)}
}
function drawFootprints(){
  for(const f of footprints){const x=sx(f.x),y=sy(f.y);X.save();X.globalAlpha=f.l/7;X.fillStyle='#65735f';X.beginPath();X.ellipse(x,y,2.5,5,.2,0,Math.PI*2);X.fill();X.restore()}
}

enhancedUpdate=function(dt){baseEnhancedUpdate(dt);updateLivingWorld(dt);recordFootprints(dt)};

/* Correct damage feedback for the expanded telegraph system. */
const originalDie=die;
die=function(){damageVignette.value=1;originalDie()};

/* A safe, explicit respawn state machine. It prevents stale keyboard/pointer state. */
let respawnToken=0;
const originalRespawn=respawn;
respawn=function(){
  respawnToken++;
  clearInput();
  p.dead=true;
  const token=respawnToken;
  setTimeout(()=>{
    if(token!==respawnToken)return;
    originalRespawn();
    clearInput();
    p.dead=false;
    p.inv=2.5;
    p.vx=0;p.vy=0;
    const safe=safeSpawn(spawnPoint.x,spawnPoint.y,p.r);
    p.x=safe.x;p.y=safe.y;
    camera(.25);
  },0);
};

/* Keep save values sane even if an old save contained impossible numbers. */
function sanitizeSave(){
  saveData.level=clamp(Math.floor(num(saveData.level,1)),1,999);
  saveData.xp=Math.max(0,num(saveData.xp,0));saveData.gold=Math.max(0,Math.floor(num(saveData.gold,0)));saveData.potions=Math.max(0,Math.floor(num(saveData.potions,0)));saveData.kills=Math.max(0,Math.floor(num(saveData.kills,0)));saveData.deaths=Math.max(0,Math.floor(num(saveData.deaths,0)));saveData.questKills=clamp(Math.floor(num(saveData.questKills,0)),0,3);saveData.questComplete=!!saveData.questComplete;
}
sanitizeSave();

const polish={fps:60,frames:0,fpsClock:0,zoneClock:0,oldZone:'',dust:0,healPulse:0};
const puddles=[];
for(let i=0;i<44;i++){const x=300+rnd()*(world.w-600),y=300+rnd()*(world.h-600);if(!blocked(x,y,14))puddles.push({x,y,w:10+rnd()*28,h:5+rnd()*12,a:rnd()*6.28})}
function updatePolish(dt){
  polish.frames++;polish.fpsClock+=dt;if(polish.fpsClock>=1){polish.fps=polish.frames;polish.frames=0;polish.fpsClock=0}
  polish.zoneClock+=dt;
  const z=currentZone();if(z!==polish.oldZone&&polish.oldZone){msg('📍 '+z)}polish.oldZone=z;
  for(const q of puddles)q.a+=dt*.25;
  if(p.hp>0&&p.hp<p.maxHp&&p.inv<=0&&Math.hypot(p.vx,p.vy)<4)polish.healPulse=Math.min(1,polish.healPulse+dt*.4);else polish.healPulse=Math.max(0,polish.healPulse-dt*.6);
}
function drawPuddles(){
  for(const q of puddles){const x=sx(q.x),y=sy(q.y);if(x<-60||x>W+60||y<-60||y>H+60)continue;X.save();X.globalAlpha=.14;X.fillStyle='#101b1b';X.beginPath();X.ellipse(x,y,q.w,q.h,Math.sin(q.a)*.2,0,Math.PI*2);X.fill();X.globalAlpha=.12;X.strokeStyle='#d0e3d7';X.beginPath();X.ellipse(x,y,q.w*.65,q.h*.5,0,0,Math.PI*2);X.stroke();X.restore()}
}
function drawEntityGlow(x,y,r,color,alpha){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color.replace(')',','+alpha+')'));}
function drawLowHealthEffect(){const ratio=p.hp/p.maxHp;if(ratio>.28)return;const pulse=.04+.07*(.5+.5*Math.sin(elapsed*6));const g=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,'rgba(150,0,12,'+pulse+')');X.fillStyle=g;X.fillRect(0,0,W,H)}
function drawZoneBanner(){if(polish.zoneClock<2.2&&polish.oldZone){const a=Math.min(1,polish.zoneClock/.35)*Math.min(1,(2.2-polish.zoneClock)/.55);X.save();X.globalAlpha=a;X.textAlign='center';X.font='700 18px Arial';X.fillStyle='#eaf4f6';X.fillText(polish.oldZone,W/2,95);X.font='10px Arial';X.fillStyle='#9fb3bd';X.fillText('REGION',W/2,112);X.restore()}}
function drawChestMarker(){const c=nearestChest();if(!c)return;const x=sx(c.x),y=sy(c.y);if(x<-100||x>W+100||y<-100||y>H+100)return;X.save();X.globalAlpha=.8;X.strokeStyle='#ffd76a';X.lineWidth=1.5;X.setLineDash([4,5]);X.beginPath();X.arc(x,y,35+Math.sin(elapsed*3)*3,0,Math.PI*2);X.stroke();X.setLineDash([]);X.font='bold 10px Arial';X.textAlign='center';X.fillStyle='#ffe39a';X.fillText('E  TRUHE',x,y-43);X.restore()}
function drawAttackTelegraph(){if(p.atk<=0)return;const progress=1-p.atk/.28;const x=sx(p.x),y=sy(p.y),ang=dirAngle();X.save();X.globalAlpha=.15+.35*Math.sin(progress*Math.PI);X.fillStyle='#dff8ff';X.beginPath();X.moveTo(x,y);X.arc(x,y,78,ang-.8,ang+.8);X.closePath();X.fill();X.restore()}
function drawEnemyTelegraphs(){for(const e of enemies){if(!e.telegraph||e.dead)continue;const x=sx(e.x),y=sy(e.y);X.save();X.globalAlpha=.55;X.strokeStyle='#ffb36b';X.lineWidth=2;X.beginPath();X.arc(x,y,e.r+9,-Math.PI/2,-Math.PI/2+Math.PI*2*(e.telegraph/.18));X.stroke();X.restore()}}
function drawPlayerStatus(){if(p.hurt>0){X.save();X.globalAlpha=.55;X.strokeStyle='#ff6870';X.lineWidth=3;X.beginPath();X.arc(sx(p.x),sy(p.y),42+p.hurt*20,0,Math.PI*2);X.stroke();X.restore()}if(polish.healPulse>0){X.save();X.globalAlpha=.18*polish.healPulse;X.strokeStyle='#71ef9b';X.lineWidth=2;X.beginPath();X.arc(sx(p.x),sy(p.y),32+polish.healPulse*8,0,Math.PI*2);X.stroke();X.restore()}}
function drawPerformanceHint(){if(W<900)return;X.save();X.globalAlpha=.35;X.font='9px Arial';X.textAlign='left';X.fillStyle='#b9c8ce';X.fillText(Math.round(polish.fps)+' FPS',18,H-8);X.restore()}

  drawLandmarks();drawFootprints();drawAmbientCreatures();drawEnemyTelegraphs();drawAttackTelegraph();effectsDraw();drawPlayerStatus();drawAtmosphericSparks();drawFireflies();drawFog();drawRainMist();drawWeather();drawPlayerLight();lightingOverlay();drawStaminaBar();drawChestMarker();drawZoneBanner();drawLowHealthEffect();drawDamageVignette();drawPerformanceHint();
