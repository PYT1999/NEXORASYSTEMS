<!doctype html>
<html lang="de">
<head>

<title>NEXORA 5.0.1 — Realm of Ash</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071016;color:#fff;font-family:Inter,Arial,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;z-index:20;left:14px;top:14px;width:300px;padding:14px 15px;border:1px solid #ffffff24;border-radius:18px;background:linear-gradient(145deg,#071019dc,#101720c9);backdrop-filter:blur(14px);box-shadow:0 12px 40px #0009;pointer-events:none}.logo{font-size:25px;font-weight:1000;letter-spacing:7px;text-shadow:0 0 18px #6edcff55;margin-bottom:8px}.sub{font-size:10px;color:#9eb2c4;letter-spacing:2px;margin-top:-5px;margin-bottom:10px}.bar{height:11px;margin:4px 0 8px;background:#17212a;border:1px solid #ffffff12;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:100%;border-radius:20px;transition:width .12s}.hp{background:linear-gradient(90deg,#8f2035,#ef5964,#ff8b6b)}.xp{background:linear-gradient(90deg,#166ec0,#40c9ff,#b4f2ff)}.stats{font-size:12px;line-height:1.65;color:#d9e3eb}.stats b{color:#fff}.quest{margin-top:9px;padding:9px 10px;border:1px solid #ffc44a30;border-radius:11px;background:#ffc44a0c;font-size:12px;line-height:1.4}.quest b{color:#ffd66e;letter-spacing:1px}#save{position:fixed;right:14px;top:14px;z-index:20;background:#05090dd0;border:1px solid #ffffff1b;padding:7px 10px;border-radius:10px;font-size:11px;color:#cfe2ef;pointer-events:none}#msg{position:fixed;z-index:30;left:50%;bottom:125px;transform:translateX(-50%);padding:10px 18px;border-radius:24px;background:#03070ce8;border:1px solid #ffffff20;box-shadow:0 8px 30px #0008;opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap;font-size:13px}#interact{position:fixed;z-index:25;left:50%;top:16%;transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#05090ddd;border:1px solid #ffffff1b;opacity:0;font-size:12px;pointer-events:none}
#controls{position:fixed;z-index:25;left:18px;bottom:18px;display:grid;grid-template-columns:58px 58px 58px;gap:5px}.move{width:58px;height:58px;border:1px solid #ffffff28;border-radius:16px;background:#0b141ddf;color:#fff;font-size:22px;box-shadow:0 7px 22px #0007}.move:active{transform:scale(.94);background:#315b7dcc}#attack,#potion{position:fixed;z-index:25;color:#fff;font-weight:900;box-shadow:0 9px 28px #0008}.round{border-radius:50%}#attack{right:24px;bottom:26px;width:96px;height:96px;border:3px solid #ffffff40;background:radial-gradient(circle at 35% 30%,#d95765,#801e32 70%);font-size:13px}#attack:active,#potion:active{transform:scale(.94)}#potion{right:132px;bottom:34px;width:65px;height:65px;border:2px solid #ffffff30;background:radial-gradient(circle at 35% 30%,#4b9bd5,#164d7c);font-size:11px}#mini{position:fixed;right:14px;bottom:14px;width:190px;height:130px;border:1px solid #ffffff24;border-radius:14px;background:#05090ddd;box-shadow:0 8px 30px #0007}@media(max-width:700px){#hud{width:270px;transform:scale(.78);transform-origin:top left;left:8px;top:8px}.logo{font-size:22px}#mini{display:none}#controls{left:10px;bottom:10px}.move{width:54px;height:54px}#attack{right:16px;bottom:18px}#potion{right:120px;bottom:26px}#msg{bottom:112px;font-size:12px}}

<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="logo">NEXORA</div><div class="sub">REALM OF ASH · 5.0.1</div>

<button id="potion" class="round">🧪<br>TRANK</button><button id="attack" class="round">⚔<br>ANGRIFF</button><canvas id="mini"></canvas>
<script>
'use strict';
const C=document.getElementById('game'),X=C.getContext('2d'),M=document.getElementById('mini'),MX=M.getContext('2d');
const hpBar=document.getElementById('hpBar'),xpBar=document.getElementById('xpBar'),hpText=document.getElementById('hpText'),xpText=document.getElementById('xpText'),levelEl=document.getElementById('level'),attackText=document.getElementById('attackText'),goldEl=document.getElementById('gold'),potionsEl=document.getElementById('potions'),killsEl=document.getElementById('kills'),questText=document.getElementById('questText'),saveEl=document.getElementById('save'),msgEl=document.getElementById('msg'),interactEl=document.getElementById('interact');
const attackBtn=document.getElementById('attack'),potionBtn=document.getElementById('potion');
let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);C.width=Math.max(1,Math.floor(W*D));C.height=Math.max(1,Math.floor(H*D));X.setTransform(D,0,0,D,0,0);M.width=380;M.height=260}addEventListener('resize',resize);resize();
const world={w:5000,h:3500},KEY='nexora_save_v501';
const water={x:3300,y:0,w:900,h:700};
const def={level:1,xp:0,gold:25,potions:3,kills:0,maxHp:100,hp:100,attack:25,x:1050,y:1250,questKills:0,questComplete:false};
let s={...def};try{const raw=localStorage.getItem(KEY)||localStorage.getItem('nexora_save_v10');if(raw)s={...def,...JSON.parse(raw)}}catch(e){}
const p={x:Number(s.x)||1050,y:Number(s.y)||1250,r:18,speed:285,vx:0,vy:0,acc:1850,fric:1450,hp:Number(s.hp)||100,maxHp:Number(s.maxHp)||100,attack:Number(s.attack)||25,dir:'down',step:0,atk:0,cd:0,inv:0,hurt:0,idle:0};
const cam={x:0,y:0,shake:0};const keys=Object.create(null);const dirs={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyA:[-1,0],KeyS:[0,1],KeyD:[1,0],w:[0,-1],a:[-1,0],s:[0,1],d:[1,0]};
function clearKeys(){for(const k in keys)keys[k]=false;p.vx=p.vy=0}addEventListener('blur',clearKeys);addEventListener('visibilitychange',()=>{if(document.hidden)clearKeys();last=performance.now()});addEventListener('keydown',e=>{if(dirs[e.key]||dirs[e.code]){keys[e.key]=true;keys[e.code]=true;e.preventDefault()}if(e.code==='Space'&&!e.repeat){e.preventDefault();attack()}if(e.key.toLowerCase()==='q'&&!e.repeat)potion();if(e.key.toLowerCase()==='e'&&!e.repeat)talk();if(e.key.toLowerCase()==='r'&&!e.repeat)resetGame();});addEventListener('keyup',e=>{keys[e.key]=false;keys[e.code]=false});
addEventListener('pointerup',()=>{for(const k of Object.keys(keys))keys[k]=false});addEventListener('pointercancel',()=>{for(const k of Object.keys(keys))keys[k]=false});document.querySelectorAll('.move').forEach(btn=>{const k=btn.dataset.k;const down=e=>{e.preventDefault();keys[k]=true;try{btn.setPointerCapture(e.pointerId)}catch(_){} };const up=e=>{e.preventDefault();keys[k]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',e=>{if(!e.buttons)keys[k]=false})});
attackBtn.addEventListener('click',attack);potionBtn.addEventListener('click',potion);addEventListener('beforeunload',save);
const obs=[];function O(x,y,w,h,t){obs.push({x,y,w,h,t,id:obs.length})}O(1250,820,420,320,'house');O(1740,850,360,290,'house');O(1440,680,300,190,'house');[[650,550,90,70],[900,1600,120,80],[3800,850,110,90],[4200,2100,140,90],[3000,2500,120,90]].forEach(a=>O(...a,'rock'));
let seed=91827;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<125;i++){const x=100+rnd()*4800,y=100+rnd()*3300;if(x>1050&&x<2200&&y>560&&y<1400)continue;if(x>3200&&x<4250&&y<850)continue;O(x,y,42,42,'tree')}
const npc={x:1600,y:650,anim:0};
const types=[['Schattenwolf',70,9,35,7,92,21,'wolf'],['Knochenwächter',120,14,60,14,58,24,'skeleton'],['Aschenbestie',180,20,90,25,65,31,'beast']];let enemies=[];
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function circleRect(x,y,r,o){const nx=Math.max(o.x,Math.min(x,o.x+o.w)),ny=Math.max(o.y,Math.min(y,o.y+o.h));return (x-nx)**2+(y-ny)**2<r*r}
function collide(x,y,r){if(x<r||y<r||x>world.w-r||y>world.h-r)return true;if(circleRect(x,y,r+8,water))return true;for(const o of obs)if(circleRect(x,y,r+2,o))return true;return false}
if(collide(p.x,p.y,p.r)){p.x=1050;p.y=1250;p.vx=p.vy=0}
function spawn(){for(let z=0;z<140;z++){const t=types[(Math.random()*types.length)|0],x=160+Math.random()*4680,y=160+Math.random()*3180;if(dist({x,y},p)<720||collide(x,y,t[6])||enemies.some(e=>!e.dead&&dist({x,y},e)<150))continue;enemies.push({name:t[0],hp:t[1],maxHp:t[1],damage:t[2],xp:t[3],gold:t[4],speed:t[5],r:t[6],kind:t[7],x,y,cd:0,hit:0,dead:0,a:Math.random()*6.28,dir:0});return true}return false}for(let i=0;i<25;i++)spawn();
const parts=[],texts=[],ripples=[];function burst(x,y,c,n=12,power=150){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=30+Math.random()*power;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35+Math.random()*.55,ml:.9,c,r:1.5+Math.random()*3})}}function floatText(x,y,t,c){texts.push({x,y,t,c,l:1.05,vy:28})}function ripple(x,y,r=20){ripples.push({x,y,r,l:.8})}
function input(){let x=0,y=0;for(const k of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'])if(keys[k]){const d=dirs[k]||dirs[k.slice(3).toLowerCase()];x+=d[0];y+=d[1]}const l=Math.hypot(x,y);return l?{x:x/l,y:y/l}:null}
function approach(v,target,a){return v<target?Math.min(v+a,target):Math.max(v-a,target)}
function updatePlayer(dt){const q=input();if(q){p.vx=approach(p.vx,q.x*p.speed,p.acc*dt);p.vy=approach(p.vy,q.y*p.speed,p.acc*dt);if(Math.abs(q.x)>Math.abs(q.y))p.dir=q.x>0?'right':'left';else p.dir=q.y>0?'down':'up';p.idle=0}else{p.vx=approach(p.vx,0,p.fric*dt);p.vy=approach(p.vy,0,p.fric*dt);p.idle+=dt}const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;if(!collide(nx,p.y,p.r))p.x=nx;else p.vx=0;if(!collide(p.x,ny,p.r))p.y=ny;else p.vy=0;const sp=Math.hypot(p.vx,p.vy);if(sp>8)p.step+=dt*(7+sp/p.speed*8);p.cd=Math.max(0,p.cd-dt);p.atk=Math.max(0,p.atk-dt);p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt)}
function attack(){if(p.cd>0)return;p.cd=.34;p.atk=.27;let target=null,best=Infinity;for(const e of enemies){if(e.dead)continue;const dd=dist(p,e);if(dd<120&&dd<best){best=dd;target=e}}burst(p.x+p.vx*.05,p.y+p.vy*.05,'#dff8ff',7,100);ripple(p.x,p.y,32);if(!target){msg('Kein Gegner in Reichweite');return}const damage=p.attack+((Math.random()*9)|0);target.hp-=damage;target.hit=.16;target.dir=Math.atan2(target.y-p.y,target.x-p.x);floatText(target.x,target.y-35,'-'+damage,'#ffd166');burst(target.x,target.y,'#ffcb68',12,120);cam.shake=Math.max(cam.shake,5);if(target.hp<=0)killEnemy(target)}
function killEnemy(e){e.dead=.001;s.xp+=e.xp;s.gold+=e.gold;s.kills++;if(s.questKills<3)s.questKills++;floatText(e.x,e.y-40,'+'+e.xp+' XP','#6ee7ff');burst(e.x,e.y,'#9c6cff',26,190);ripple(e.x,e.y,45);if(Math.random()<.18){s.potions++;msg('🧪 Ein Trank wurde gefunden!')}else msg('+'+e.gold+' Gold  ·  +'+e.xp+' XP');checkLevel();checkQuest();save()}
function checkLevel(){let need=100+(s.level-1)*40;while(s.xp>=need){s.xp-=need;s.level++;p.maxHp+=20;p.hp=p.maxHp;p.attack+=5;burst(p.x,p.y,'#ffe16b',45,230);ripple(p.x,p.y,70);msg('🔥 LEVEL '+s.level+'!');need=100+(s.level-1)*40}}
function checkQuest(){if(!s.questComplete&&s.questKills>=3){s.questComplete=true;s.gold+=100;s.potions+=2;s.xp+=150;burst(npc.x,npc.y,'#ffe36e',40,180);msg('⭐ QUEST ABGESCHLOSSEN! +100 Gold');checkLevel();save()}}
function talk(){if(dist(p,npc)>135){msg('Eira ist nicht in der Nähe');return}if(!s.questComplete){if(s.questKills<3)msg('Eira: Besiege noch '+(3-s.questKills)+' Schattenwesen!');else checkQuest()}else msg('Eira: Die Schatten ziehen sich zurück...')}
function potion(){if(!s.potions)return msg('Keine Tränke!');if(p.hp>=p.maxHp)return msg('Deine HP sind bereits voll');s.potions--;p.hp=Math.min(p.maxHp,p.hp+60);burst(p.x,p.y,'#58e092',20,120);ripple(p.x,p.y,35);floatText(p.x,p.y-30,'+60 HP','#6ff0a0');msg('+60 HP 🧪');save()}
function enemyAI(dt){for(const e of enemies){if(e.dead){e.dead+=dt;continue}e.a+=dt*5;e.cd=Math.max(0,e.cd-dt);e.hit=Math.max(0,e.hit-dt);const dx=p.x-e.x,dy=p.y-e.y,dd=Math.hypot(dx,dy);if(dd<520&&dd>64){const nx=dx/dd,ny=dy/dd,tx=e.x+nx*e.speed*dt,ty=e.y+ny*e.speed*dt;e.dir=Math.atan2(dy,dx);if(!collide(tx,e.y,e.r))e.x=tx;if(!collide(e.x,ty,e.r))e.y=ty}else if(dd>=520){e.dir+=Math.sin(e.a*.3)*dt*.3}if(dd<=64&&!e.cd&&!p.inv){p.hp-=e.damage;p.inv=.48;p.hurt=.22;e.cd=1.05;floatText(p.x,p.y-34,'-'+e.damage,'#ff626c');burst(p.x,p.y,'#ff515d',10,120);cam.shake=Math.max(cam.shake,8);if(p.hp<=0){p.hp=p.maxHp;p.x=1450;p.y=1050;p.vx=p.vy=0;p.inv=3;s.gold=Math.max(0,s.gold-15);msg('💀 Du wurdest besiegt! -15 Gold');save()}}}
for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead>.55){enemies.splice(i,1);spawn()}
for(let i=0;i<enemies.length;i++)for(let j=i+1;j<enemies.length;j++){const a=enemies[i],b=enemies[j];if(a.dead||b.dead)continue;let dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy),min=a.r+b.r+3;if(dd&&dd<min){const z=(min-dd)*.5,nx=dx/dd,ny=dy/dd;a.x-=nx*z;a.y-=ny*z;b.x+=nx*z;b.y+=ny*z}}}
function updateFX(dt){for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=Math.pow(.05,dt);q.vy*=Math.pow(.05,dt);q.l-=dt;if(q.l<=0)parts.splice(i,1)}for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.y-=q.vy*dt;q.l-=dt;if(q.l<=0)texts.splice(i,1)}for(let i=ripples.length-1;i>=0;i--){const q=ripples[i];q.r+=65*dt;q.l-=dt;if(q.l<=0)ripples.splice(i,1)}cam.shake=Math.max(0,cam.shake-dt*24)}
function save(){try{Object.assign(s,{x:p.x,y:p.y,hp:p.hp,maxHp:p.maxHp,attack:p.attack});localStorage.setItem(KEY,JSON.stringify(s));saveEl.textContent='💾 Gespeichert';clearTimeout(save.timer);save.timer=setTimeout(()=>saveEl.textContent='💾 Lokal',850)}catch(e){}}
function resetGame(){if(confirm('NEXORA wirklich komplett zurücksetzen?')){localStorage.removeItem(KEY);localStorage.removeItem('nexora_save_v10');location.reload()}}
function msg(t){msgEl.textContent=t;msgEl.style.opacity='1';clearTimeout(msg.timer);msg.timer=setTimeout(()=>msgEl.style.opacity='0',1800)}
function camera(dt){const tx=Math.max(0,Math.min(world.w-W,p.x-W/2)),ty=Math.max(0,Math.min(world.h-H,p.y-H/2)),k=1-Math.pow(.0007,dt);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k}
function screenX(x){return x-cam.x+(cam.shake?((Math.random()-.5)*cam.shake):0)}function screenY(y){return y-cam.y+(cam.shake?((Math.random()-.5)*cam.shake):0)}
function terrain(){X.fillStyle='#14251a';X.fillRect(0,0,W,H);const size=64,sx=Math.floor(cam.x/size)*size,sy=Math.floor(cam.y/size)*size;for(let y=sy;y<cam.y+H+size;y+=size)for(let x=sx;x<cam.x+W+size;x+=size){const n=(Math.abs((x/size*17+y/size*31))%11);X.fillStyle=n<2?'#162b1b':n<5?'#18301e':'#1a3220';X.fillRect(x-cam.x,y-cam.y,size+1,size+1)}
// paths
X.fillStyle='#5a4a36';X.fillRect(screenX(0),screenY(980),world.w,150);X.fillRect(screenX(1450),screenY(0),150,world.h);X.fillStyle='#786143';X.fillRect(screenX(0),screenY(1010),world.w,6);X.fillRect(screenX(1520),screenY(0),6,world.h);
// water
const wx=screenX(3300),wy=screenY(0);X.fillStyle='#123c54';X.fillRect(wx,wy,water.w,water.h);X.fillStyle='#174a63';for(let y=35;y<700;y+=45){const off=Math.sin(performance.now()*.001+y*.08)*16;X.fillRect(wx+25+off,wy+y,790,2)}
// subtle vignette
const g=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.15,W/2,H/2,Math.max(W,H)*.72);g.addColorStop(0,'#00000000');g.addColorStop(1,'#02060a78');X.fillStyle=g;X.fillRect(0,0,W,H)}
function shadow(x,y,a,b,alpha=.32){X.fillStyle='rgba(0,0,0,'+alpha+')';X.beginPath();X.ellipse(x,y,a,b,0,0,Math.PI*2);X.fill()}
function treeDraw(o){const x=screenX(o.x),y=screenY(o.y),sway=Math.sin(performance.now()*.0012+o.id)*1.7;shadow(x+21,y+47,27,8,.38);X.fillStyle='#60432d';X.fillRect(x+15,y+16,13,34);X.fillStyle='#173b25';X.beginPath();X.arc(x+22+sway,y+1,29,0,Math.PI*2);X.arc(x+2+sway,y+15,21,0,Math.PI*2);X.arc(x+42+sway,y+15,21,0,Math.PI*2);X.fill();X.fillStyle='#255735';X.beginPath();X.arc(x+17+sway,y-7,16,0,Math.PI*2);X.fill();X.fillStyle='#3c7444';X.beginPath();X.arc(x+12+sway,y-12,7,0,Math.PI*2);X.fill()}
function rockDraw(o){const x=screenX(o.x),y=screenY(o.y);shadow(x+o.w/2,y+o.h,35,8,.4);const gr=X.createLinearGradient(x,y,x+o.w,y+o.h);gr.addColorStop(0,'#879099');gr.addColorStop(1,'#454c53');X.fillStyle=gr;X.beginPath();X.moveTo(x,y+o.h);X.lineTo(x+15,y+9);X.lineTo(x+o.w/2,y-12);X.lineTo(x+o.w,y+14);X.lineTo(x+o.w-8,y+o.h);X.closePath();X.fill();X.strokeStyle='#aeb6bb55';X.stroke()}
function houseDraw(o){const x=screenX(o.x),y=screenY(o.y);shadow(x+o.w/2,y+o.h+8,o.w*.55,12,.34);X.fillStyle='#3f3027';X.fillRect(x+8,y+12,o.w,o.h);X.fillStyle='#6a4734';X.fillRect(x,y,o.w,o.h);X.fillStyle='#88413b';X.beginPath();X.moveTo(x-24,y+4);X.lineTo(x+o.w/2,y-78);X.lineTo(x+o.w+24,y+4);X.closePath();X.fill();X.fillStyle='#b9604e55';X.fillRect(x+12,y+10,o.w-24,7);X.fillStyle='#d6c778';X.fillRect(x+45,y+70,48,45);X.fillRect(x+o.w-93,y+70,48,45);X.fillStyle='#4a2c24';X.fillRect(x+o.w/2-16,y+o.h-75,32,75)}
function objects(){for(const o of obs){if(o.x-cam.x>W+120||o.x+o.w-cam.x<-120||o.y-cam.y>H+140||o.y+o.h-cam.y<-140)continue;if(o.t==='tree')treeDraw(o);else if(o.t==='rock')rockDraw(o);else houseDraw(o)}}
function npcDraw(){const x=screenX(npc.x),y=screenY(npc.y),bob=Math.sin(npc.anim*3)*2;shadow(x,y+31,21,7,.4);X.fillStyle='#56368f';X.beginPath();X.moveTo(x-20,y+30+bob);X.lineTo(x+20,y+30+bob);X.lineTo(x+14,y-4+bob);X.lineTo(x-14,y-4+bob);X.closePath();X.fill();X.fillStyle='#e9b38a';X.beginPath();X.arc(x,y-17+bob,13,0,Math.PI*2);X.fill();X.fillStyle='#241a30';X.beginPath();X.arc(x,y-22+bob,14,Math.PI,Math.PI*2);X.fill();X.fillStyle='#ffe66a';X.font='bold 12px Arial';X.textAlign='center';X.fillText('Eira',x,y-46+bob);if(dist(p,npc)<135){X.fillStyle='#fff';X.font='bold 16px Arial';X.fillText('E',x,y-62+bob)}}
function enemyDraw(e){const x=screenX(e.x),y=screenY(e.y),fade=e.dead?Math.max(0,1-e.dead/.55):1;if(x<-120||x>W+120||y<-120||y>H+120)return;X.globalAlpha=fade;const moving=!e.dead;const bob=moving?Math.sin(e.a)*2:0;shadow(x,y+e.r+7,e.r,7,.38);if(e.kind==='wolf'){X.fillStyle=e.hit?'#fff':'#573b77';X.beginPath();X.ellipse(x,y+bob,e.r+6,e.r-2,0,0,Math.PI*2);X.fill();X.fillStyle='#6f4c95';X.beginPath();X.moveTo(x-13,y-10+bob);X.lineTo(x-24,y-32+bob);X.lineTo(x-5,y-20+bob);X.closePath();X.fill();X.beginPath();X.moveTo(x+13,y-10+bob);X.lineTo(x+24,y-32+bob);X.lineTo(x+5,y-20+bob);X.closePath();X.fill();X.fillStyle='#e96d78';X.beginPath();X.arc(x-8,y-2+bob,2.5,0,7);X.arc(x+8,y-2+bob,2.5,0,7);X.fill()}else if(e.kind==='skeleton'){X.fillStyle=e.hit?'#fff':'#bfc6ca';X.beginPath();X.arc(x,y-7+bob,13,0,Math.PI*2);X.fill();X.fillRect(x-10,y+5+bob,20,21);X.strokeStyle='#7c8489';X.lineWidth=3;for(let i=-6;i<=6;i+=6){X.beginPath();X.moveTo(x+i,y+8+bob);X.lineTo(x+i,y+22+bob);X.stroke()}X.fillStyle='#252a2d';X.fillRect(x-7,y-10+bob,4,5);X.fillRect(x+3,y-10+bob,4,5)}else{X.fillStyle=e.hit?'#fff':'#8d372d';X.beginPath();X.ellipse(x,y+bob,e.r+3,e.r,0,0,Math.PI*2);X.fill();X.fillStyle='#6a2925';X.beginPath();X.moveTo(x-20,y-14+bob);X.lineTo(x-32,y-42+bob);X.lineTo(x-6,y-26+bob);X.closePath();X.fill();X.beginPath();X.moveTo(x+20,y-14+bob);X.lineTo(x+32,y-42+bob);X.lineTo(x+6,y-26+bob);X.closePath();X.fill();X.fillStyle='#ffbf4e';X.beginPath();X.arc(x-9,y-3+bob,3,0,7);X.arc(x+9,y-3+bob,3,0,7);X.fill()}if(!e.dead){X.fillStyle='#111a';X.fillRect(x-30,y-e.r-21,60,6);X.fillStyle='#db4850';X.fillRect(x-30,y-e.r-21,60*Math.max(0,e.hp/e.maxHp),6);X.fillStyle='#fff';X.font='10px Arial';X.textAlign='center';X.fillText(e.name,x,y+e.r+24)}X.globalAlpha=1}
function playerDraw(){const x=screenX(p.x),y=screenY(p.y),sp=Math.hypot(p.vx,p.vy),moving=sp>8,walk= moving?Math.sin(p.step):Math.sin(performance.now()*.002)*.12,bob=moving?Math.abs(walk)*1.8:Math.sin(performance.now()*.0024)*.7,stride=moving?walk*5:0;shadow(x,y+29,23,8,.43);if(p.inv){X.strokeStyle='#62dcffbb';X.lineWidth=4;X.beginPath();X.arc(x,y,32,0,Math.PI*2);X.stroke()}X.strokeStyle='#17273a';X.lineWidth=8;X.lineCap='round';X.beginPath();X.moveTo(x-7,y+12+bob);X.lineTo(x-8+stride,y+30+bob);X.moveTo(x+7,y+12+bob);X.lineTo(x+8-stride,y+30+bob);X.stroke();X.fillStyle=p.hurt?'#fff':'#2b76cc';X.beginPath();X.moveTo(x-19,y+25+bob);X.lineTo(x+19,y+25+bob);X.lineTo(x+14,y-7+bob);X.lineTo(x-14,y-7+bob);X.closePath();X.fill();X.fillStyle='#e7ad7d';X.beginPath();X.arc(x,y-18+bob,13,0,Math.PI*2);X.fill();X.fillStyle='#292438';X.beginPath();X.arc(x,y-23+bob,14,Math.PI,Math.PI*2);X.fill();const base=p.dir==='up'?-Math.PI/2:p.dir==='down'?Math.PI/2:p.dir==='left'?Math.PI:0;let ang=base;if(p.atk){const q=1-p.atk/.27;ang+=(q-.5)*2.55}X.save();X.translate(x,y);X.rotate(ang);X.strokeStyle='#e9f2fa';X.lineWidth=5;X.beginPath();X.moveTo(9,4);X.lineTo(51,4);X.stroke();X.strokeStyle='#8c5b38';X.lineWidth=4;X.beginPath();X.moveTo(7,-5);X.lineTo(7,13);X.stroke();X.restore();if(p.atk){X.strokeStyle='#dff8ffff';X.lineWidth=5;X.beginPath();X.arc(x,y,56,ang-.78,ang+.78);X.stroke()}}
function effectsDraw(){for(const q of ripples){X.globalAlpha=q.l*.55;X.strokeStyle='#8fe7ff';X.lineWidth=2;X.beginPath();X.arc(screenX(q.x),screenY(q.y),q.r,0,Math.PI*2);X.stroke()}for(const q of parts){X.globalAlpha=q.l/q.ml;X.fillStyle=q.c;X.beginPath();X.arc(screenX(q.x),screenY(q.y),q.r,0,Math.PI*2);X.fill()}X.globalAlpha=1;X.textAlign='center';X.font='bold 16px Arial';for(const q of texts){X.globalAlpha=q.l;X.fillStyle=q.c;X.fillText(q.t,screenX(q.x),screenY(q.y))}X.globalAlpha=1}
function render(){terrain();const list=[];for(const o of obs){if(o.t!=='tree')list.push({y:o.y+o.h,fn:()=>o.t==='rock'?rockDraw(o):houseDraw(o)})}for(const o of obs)if(o.t==='tree')list.push({y:o.y+o.h,fn:()=>treeDraw(o)});list.push({y:npc.y+30,fn:npcDraw});for(const e of enemies)list.push({y:e.y+e.r,fn:()=>enemyDraw(e)});list.push({y:p.y+p.r,fn:playerDraw});list.sort((a,b)=>a.y-b.y);for(const z of list)z.fn();effectsDraw()}
function mini(){MX.clearRect(0,0,380,260);MX.fillStyle='#101b15';MX.fillRect(0,0,380,260);const sx=380/world.w,sy=260/world.h;MX.fillStyle='#5d4b38';MX.fillRect(0,600*sy,380,800*sy);MX.fillStyle='#173f56';MX.fillRect(water.x*sx,water.y*sy,water.w*sx,water.h*sy);for(const e of enemies)if(!e.dead){MX.fillStyle='#e44d58';MX.fillRect(e.x*sx-2,e.y*sy-2,4,4)}MX.fillStyle='#ffe66a';MX.fillRect(npc.x*sx-3,npc.y*sy-3,6,6);MX.fillStyle='#4dc8ff';MX.fillRect(p.x*sx-4,p.y*sy-4,8,8)}
function hud(){const hp=Math.max(0,p.hp/p.maxHp),need=100+(s.level-1)*40;hpBar.style.width=(hp*100)+'%';xpBar.style.width=(Math.min(1,s.xp/need)*100)+'%';hpText.textContent=Math.floor(p.hp)+' / '+p.maxHp;xpText.textContent=Math.floor(s.xp)+' / '+need;levelEl.textContent=s.level;attackText.textContent=p.attack;goldEl.textContent=s.gold;potionsEl.textContent=s.potions;killsEl.textContent=s.kills;questText.textContent=s.questComplete?'Quest abgeschlossen! Sprich mit Eira.':'Eira: Besiege '+s.questKills+'/3 Schattenwesen.';interactEl.style.opacity=dist(p,npc)<135?'1':'0';interactEl.textContent='E · Mit Eira sprechen'}
let last=performance.now(),auto=0;let fatal=false;addEventListener('error',e=>{if(fatal)return;fatal=true;msg('⚠️ Spiel-Fehler: '+(e.message||'Unbekannt'));});function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;updatePlayer(dt);enemyAI(dt);updateFX(dt);npc.anim+=dt;camera(dt);render();mini();hud();auto+=dt;if(auto>5){auto=0;save()}}camera(1);hud();msg('⚔ Willkommen in NEXORA 5.0.1');requestAnimationFrame(loop);
</script>
